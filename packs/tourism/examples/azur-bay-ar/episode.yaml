  - text: 'اليوم الأول: الميناء القديم، وعشا جنب المية.'
  - text: 'اليوم التاني: مركب للجزر، مع وقت للراحة.'
  - text: 'اليوم التالت: قلعة التل، وأحلى وقت ليه الغروب.'
  - text: 'احجز التذاكر بدري في الويك إند، وخلي معاك مية دايمًا.'
  - text: 'مواعيد الفتح بتتغير، فراجعها قبل ما تروح.'
