# Tourism · best time to visit (template; slots are filled by `reelforge new --pack tourism`).
meta:
  id: '{{id}}'
  series: 'TRAVEL GUIDE'
  title: 'Best time to visit'
  episode: 1
  preset: tiktok
  theme: voyage
  lang: en-US
  publish:
    cover: 'When to visit {{place}}'
    caption: 'When to visit {{place}}, season by season. For most visitors, {{best}} is the sweet spot. Check local events and entry rules before you book.'
    hashtags: ['#travel', '#traveltips', '#besttimetovisit']
    pinned: 'Comment {{keyword}} and we will share a packing list.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'When is the best time to visit {{place}}? It depends on what you want.'
  - text: 'Here are our example numbers through the year, season by season.'
  - text: 'Summer is the warmest season, but also the busiest.'
  - text: 'Winter is quiet and often cheaper, though some places close.'
  - text: 'For most visitors, {{best}} is the sweet spot.'
  - text: 'Check local events and entry rules before you book.'
  - text: 'Comment {{keyword}} and we will share a packing list.'

chapters:
  - { at: l1, label: '01 · THE QUESTION' }
  - { at: l2, label: '02 · THE SEASONS' }
  - { at: l5, label: '03 · OUR PICK' }

scenes:
  - id: hook
    at: l1
    glow: '{{accent}}'
    camera: push-in
    elements:
      - use: label
        id: kicker
        props: { text: 'Best time to visit', dot: true, align: center }
        place: { x: 140, y: 170, w: 800, h: 60 }
        enter: { at: "l1:'best'", anim: wipe }
      - use: title
        id: place
        props: { text: '**{{place}}**', size: 112, accent: '{{accent}}' }
        place: { x: 60, y: 250, w: 960, h: 300 }
        enter: { at: 'l1+1.4', anim: reveal }
      - use: icon
        id: hook_icon
        props: { name: clock, color: '{{accent}}', ring: true }
        place: { x: 460, y: 640, w: 160, h: 160 }
        enter: { at: "l1:'depends'", anim: pop }

  - id: seasons
    at: l2
    transition: push
    elements:
      - use: bar-chart
        id: chart
        props:
          title: '{{metric}}'
          color: cyan
          accent: '{{accent}}'
          focus: { index: 1, at: "l3:'Summer'" }
          bars:
            - { label: 'Spring', value: {{spring}} }
            - { label: 'Summer', value: {{summer}} }
            - { label: 'Autumn', value: {{autumn}} }
            - { label: 'Winter', value: {{winter}} }
        place: { x: 60, y: 20, w: 960, h: 520 }
        enter: { at: "l2:'example'", anim: fade }
      - use: chip
        id: busy
        props: { text: 'Summer: warmest and busiest', icon: users, color: '{{accent}}', size: 32 }
        place: { x: 160, y: 590, w: 760, h: 96 }
        enter: { at: "l3:'busiest'", anim: pop }
      - use: chip
        id: quiet
        props: { text: 'Winter: quiet, some places close', icon: clock, color: cyan, size: 32 }
        place: { x: 160, y: 710, w: 760, h: 96 }
        enter: { at: "l4:'Winter'", anim: pop }

  - id: pick
    at: l5
    glow: '{{accent}}'
    transition: zoom
    elements:
      - use: label
        id: sweet
        props: { text: 'The sweet spot', dot: true, align: center }
        place: { x: 140, y: 140, w: 800, h: 60 }
        enter: { at: "l5:'visitors'", anim: wipe }
      - use: title
        id: best
        props: { text: '**{{best}}**', size: 112, accent: '{{accent}}' }
        place: { x: 60, y: 220, w: 960, h: 280 }
        enter: { at: "l5:'sweet'", anim: reveal }
      - use: chip
        id: rules
        props: { text: 'Check events and entry rules', icon: globe, color: dim, size: 32 }
        place: { x: 160, y: 600, w: 760, h: 96 }
        enter: { at: "l6:'events'", anim: pop }

  - id: outro
    at: l7
    transition: slide-up
    elements:
      - use: cta
        id: next
        props:
          label: 'COMING UP'
          next: 'What to pack for {{place}}'
          keyword: '{{keyword}}'
          color: '{{accent}}'
          at: "l7:'share'"
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l7:'Comment'", anim: rise }
