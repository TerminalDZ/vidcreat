# Tourism · 3-day itinerary, Arabic (template; slots are filled by `reelforge new --pack tourism`).
meta:
  id: '{{id}}'
  series: 'خطة سفر'
  title: '{{place}} في 3 أيام'
  episode: 1
  preset: tiktok
  theme: voyage
  lang: ar-EG
  publish:
    cover: '{{place}} في 3 أيام'
    caption: 'خطة بسيطة لتلات أيام في {{place}} من {{org}}: {{day1}}، و{{day2}}، و{{day3}}. المواعيد بتتغير، فراجعها قبل ما تروح.'
    hashtags: ['#سفر', '#سياحة', '#خطة_سفر', '#travel']
    pinned: 'احفظ الخطة، واكتب {{keyword}} لدليل الأكل.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'تلات أيام في {{place}}؟ دي خطة بسيطة تقدر تمشي عليها.'
  - text: 'اليوم الأول: {{day1}}، وعشا جنب المية.'
  - text: 'اليوم التاني: {{day2}}، مع وقت للراحة.'
  - text: 'اليوم التالت: {{day3}}، وأحلى وقت ليه الغروب.'
  - text: 'احجز التذاكر بدري في الويك إند، وخلي معاك مية دايمًا.'
  - text: 'مواعيد الفتح بتتغير، فراجعها قبل ما تروح.'
  - text: 'احفظ الخطة، واكتب {{keyword}} لدليل الأكل.'

chapters:
  - { at: l1, label: '01 · الرحلة' }
  - { at: l2, label: '02 · يوم بيوم' }
  - { at: l5, label: '03 · نصايح' }

scenes:
  - id: hook
    at: l1
    glow: '{{accent}}'
    camera: push-in
    elements:
      - use: label
        id: org
        props: { text: '{{org}}', dot: true, align: center }
        place: { x: 140, y: 170, w: 800, h: 60 }
        enter: { at: "l1:'تلات'", anim: wipe }
      - use: title
        id: hook_title
        props: { text: '**{{place}}** في 3 أيام', size: 100, accent: '{{accent}}' }
        place: { x: 60, y: 240, w: 960, h: 340 }
        enter: { at: 'l1+0.8', anim: reveal }
      - use: icon
        id: hook_icon
        props: { name: globe, color: '{{accent}}', ring: true }
        place: { x: 460, y: 640, w: 160, h: 160 }
        enter: { at: "l1:'خطة'", anim: pop }

  - id: days
    at: l2
    transition: push
    camera: drift
    elements:
      - use: timeline
        id: trip
        props:
          color: '{{accent}}'
          markers:
            - { pos: 0.15, label: 'يوم 1', at: "l2:'الأول'" }
            - { pos: 0.5, label: 'يوم 2', at: "l3:'التاني'" }
            - { pos: 0.85, label: 'يوم 3', at: "l4:'التالت'" }
          cursor:
            - { at: "l2:'الأول'", pos: 0.15, dur: 0.6 }
            - { at: "l3:'التاني'", pos: 0.5, dur: 0.8 }
            - { at: "l4:'التالت'", pos: 0.85, dur: 0.8 }
        place: { x: 60, y: 120, w: 960, h: 260 }
        enter: { at: "l2:'اليوم'", anim: wipe }
      - use: chip
        id: d1
        props: { text: '{{day1}}', icon: globe, color: '{{accent}}', size: 42, variant: solid }
        place: { x: 160, y: 470, w: 760, h: 120 }
        enter: { at: "l2:'الأول'+0.4", anim: pop }
        exit: { at: l3, anim: fade }
      - use: chip
        id: d2
        props: { text: '{{day2}}', icon: globe, color: '{{accent}}', size: 42, variant: solid }
        place: { x: 160, y: 470, w: 760, h: 120 }
        enter: { at: "l3:'التاني'+0.4", anim: pop }
        exit: { at: l4, anim: fade }
      - use: chip
        id: d3
        props: { text: '{{day3}}', icon: globe, color: '{{accent}}', size: 42, variant: solid }
        place: { x: 160, y: 470, w: 760, h: 120 }
        enter: { at: "l4:'التالت'+0.4", anim: pop }
      - use: chip
        id: sunset
        props: { text: 'أحلى وقت: الغروب', icon: clock, color: amber, size: 34 }
        place: { x: 240, y: 650, w: 600, h: 96 }
        enter: { at: "l4:'الغروب'", anim: spring }

  - id: tips
    at: l5
    transition: zoom
    elements:
      - use: chip
        id: book
        props: { text: 'احجز بدري', icon: card, color: '{{accent}}', size: 36 }
        place: { x: 540, y: 120, w: 440, h: 104 }
        enter: { at: "l5:'احجز'", anim: pop }
      - use: chip
        id: water
        props: { text: 'خلي معاك مية', icon: check, color: '{{accent}}', size: 36 }
        place: { x: 60, y: 120, w: 440, h: 104 }
        enter: { at: "l5:'مية'", anim: pop }
      - use: title
        id: times
        props: { text: 'راجع **مواعيد الفتح**', size: 100, accent: '{{accent}}' }
        place: { x: 60, y: 290, w: 960, h: 320 }
        enter: { at: "l6:'مواعيد'", anim: reveal }

  - id: outro
    at: l7
    transition: slide-up
    elements:
      - use: cta
        id: next
        props:
          label: 'احفظ الخطة'
          prompt: 'اكتب في الكومنتات'
          next: 'تاكل فين في {{place}}'
          keyword: '{{keyword}}'
          color: '{{accent}}'
          at: "l7:'واكتب'"
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l7:'احفظ'", anim: rise }
