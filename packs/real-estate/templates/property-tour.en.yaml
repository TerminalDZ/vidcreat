# Real estate · property tour (template; slots are filled by `reelforge new --pack real-estate`).
meta:
  id: '{{id}}'
  series: 'PROPERTY TOUR'
  title: '{{place}}'
  episode: 1
  preset: tiktok
  theme: estate
  lang: en-US
  publish:
    cover: 'Inside {{place}}'
    caption: 'A quick tour of {{place}} in {{area}} with {{org}}. Price: {{price}}. For financing or legal questions, talk to a licensed lender or agent.'
    hashtags: ['#realestate', '#hometour', '#property', '#newhome']
    pinned: 'Comment {{keyword}} to book a viewing.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'Thinking of moving to {{area}}? Take a quick tour of {{place}}.'
  - text: 'The home has {{rooms}} bedrooms and about {{size}} square meters of living space.'
  - text: 'The open kitchen and the living room get natural light all day long.'
  - text: 'And the detail visitors notice first is the {{feature}}.'
  - text: 'Schools, shops and a park are all within a short walk.'
  - text: 'Price: {{price}}. Ask a licensed agent or lender about financing and fees.'
  - text: 'Want to see it in person? Comment {{keyword}} to book a viewing with {{org}}.'

chapters:
  - { at: l1, label: '01 · THE HOME' }
  - { at: l5, label: '02 · THE AREA' }
  - { at: l6, label: '03 · VIEWING' }

scenes:
  - id: hook
    at: l1
    glow: '{{accent}}'
    camera: push-in
    elements:
      - use: label
        id: org
        props: { text: '{{org}}', dot: true, align: center }
        place: { x: 140, y: 170, w: 800, h: 60 }
        enter: { at: "l1:'Thinking'", anim: wipe }
      - use: title
        id: place
        props: { text: '**{{place}}**', size: 100, accent: '{{accent}}' }
        place: { x: 60, y: 250, w: 960, h: 300 }
        enter: { at: "l1:'tour'", anim: reveal }
      - use: chip
        id: area
        props: { text: '{{area}}', icon: globe, color: '{{accent}}', size: 38 }
        place: { x: 190, y: 620, w: 700, h: 104 }
        enter: { at: "l1:'quick'", anim: spring }

  - id: specs
    at: l2
    transition: push
    elements:
      - use: label
        id: specs_label
        props: { text: 'The home', dot: true, align: center }
        place: { x: 140, y: 140, w: 800, h: 60 }
        enter: { at: "l2:'home'", anim: wipe }
      - use: stat-card
        id: rooms
        props: { label: 'Bedrooms', value: {{rooms}}, icon: key, accent: '{{accent}}' }
        place: { x: 80, y: 240, w: 430, h: 280 }
        enter: { at: "l2:'bedrooms'", anim: rise }
      - use: stat-card
        id: size
        props: { label: 'Living space', value: {{size}}, suffix: ' m²', icon: globe, accent: '{{accent}}', size: 84 }
        place: { x: 570, y: 240, w: 430, h: 280 }
        enter: { at: "l2:'square'", anim: rise }

  - id: inside
    at: l3
    transition: zoom
    camera: drift
    elements:
      - use: title
        id: light
        props: { text: 'Open kitchen, **all-day light**', size: 96, accent: '{{accent}}' }
        place: { x: 60, y: 120, w: 960, h: 300 }
        enter: { at: "l3:'kitchen'", anim: reveal }
      - use: node
        id: feature
        props: { title: '{{feature}}', sub: 'Visitors notice it first', icon: check, color: '{{accent}}', status: ok }
        place: { x: 160, y: 500, w: 760, h: 210 }
        enter: { at: "l4:'detail'", anim: pop }

  - id: area_walk
    at: l5
    transition: push
    elements:
      - use: label
        id: walk_label
        props: { text: 'A short walk away', dot: true, align: center }
        place: { x: 140, y: 170, w: 800, h: 60 }
        enter: { at: "l5:'Schools'", anim: wipe }
      - use: flow
        id: walk
        props:
          color: '{{accent}}'
          fontSize: 34
          token: false
          stages:
            - { label: 'Schools', icon: users, at: "l5:'Schools'" }
            - { label: 'Shops', icon: cart, at: "l5:'shops'" }
            - { label: 'Park', icon: globe, at: "l5:'park'" }
        place: { x: 60, y: 280, w: 960, h: 300 }
        enter: { at: "l5:'Schools'+0.2", anim: fade }

  - id: price
    at: l6
    glow: '{{accent}}'
    transition: zoom
    elements:
      - use: label
        id: price_label
        props: { text: 'Price', dot: true, align: center }
        place: { x: 140, y: 170, w: 800, h: 60 }
        enter: { at: "l6:'Price'", anim: wipe }
      - use: title
        id: price_value
        props: { text: '**{{price}}**', size: 100, accent: '{{accent}}' }
        place: { x: 60, y: 250, w: 960, h: 260 }
        enter: { at: "l6:'Price'+0.4", anim: reveal }
      - use: chip
        id: advice
        props: { text: 'Financing questions? Ask a licensed agent', icon: shield, color: dim, size: 28 }
        place: { x: 60, y: 580, w: 860, h: 96 }
        enter: { at: "l6:'licensed'", anim: pop }

  - id: outro
    at: l7
    transition: slide-up
    elements:
      - use: cta
        id: next
        props:
          label: 'BOOK A VIEWING'
          next: '{{place}}'
          keyword: '{{keyword}}'
          color: '{{accent}}'
          at: "l7:'viewing'"
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l7:'Want'", anim: rise }
