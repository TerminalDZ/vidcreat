  - text: 'تفكر في الانتقال إلى حي أوكريدج؟ تعال في جولة سريعة داخل ميبل كورت.'
  - text: 'يضم المنزل 3 غرف نوم، ومساحة معيشة تقارب 118 مترًا مربعًا.'
  - text: 'المطبخ المفتوح وغرفة المعيشة يدخلهما الضوء الطبيعي طوال اليوم.'
  - text: 'والتفصيلة التي يلاحظها الزوار أولًا هي الشرفة المشمسة.'
  - text: 'المدارس والمحلات والحديقة كلها على بعد خطوات قليلة.'
  - text: 'السعر: عند الطلب. اسأل وسيطًا مرخصًا أو جهة التمويل عن التمويل والرسوم.'
  - text: 'تحب تشوفه بنفسك؟ اكتب معاينة لحجز معاينة مع سيدار هومز.'

