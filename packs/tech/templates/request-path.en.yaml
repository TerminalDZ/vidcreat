# Tech · a request's path (template; slots are filled by `reelforge new --pack tech`).
meta:
  id: '{{id}}'
  series: 'SYSTEM DESIGN'
  title: 'A request, end to end'
  episode: 1
  preset: tiktok
  theme: default
  lang: en-US
  publish:
    cover: 'What happens after you tap Buy'
    caption: 'The path of one request in {{app}}: DNS, CDN, load balancer, API and database, in about {{ms}} milliseconds.'
    hashtags: ['#systemdesign', '#backend', '#webdev', '#programming']
    pinned: 'Comment {{keyword}} for part two: {{next}}.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'What happens in the {{ms}} milliseconds after you tap Buy in {{app}}?'
  - text: 'First, DNS turns the name into an address.'
  - text: 'A CDN answers anything static from a server near you.'
  - text: 'The load balancer picks a healthy API server.'
  - text: 'The API checks the database, then sends the answer back.'
  - text: 'Every hop adds time, so fewer hops means a faster app.'
  - text: 'Comment {{keyword}} for part two: {{next}}.'

chapters:
  - { at: l1, label: '01 · THE TAP' }
  - { at: l2, label: '02 · THE PATH' }
  - { at: l6, label: '03 · THE LESSON' }

scenes:
  - id: hook
    at: l1
    glow: '{{accent}}'
    camera: push-in
    elements:
      - use: label
        id: app
        props: { text: '{{app}}', dot: true, align: center }
        place: { x: 140, y: 120, w: 800, h: 60 }
        enter: { at: "l1:'What'", anim: wipe }
      - use: counter
        id: ms
        props:
          from: 0
          keyframes: [{ at: "l1:'happens'", value: {{ms}}, dur: 1.2 }]
          suffix: ' ms'
          label: 'TAP TO ANSWER'
          color: '{{accent}}'
        place: { x: 140, y: 200, w: 800, h: 320 }
        enter: { at: "l1:'happens'", anim: pop }
      - use: chip
        id: buy
        props: { text: 'Buy', icon: cart, color: '{{accent}}', size: 44, variant: solid }
        place: { x: 340, y: 620, w: 400, h: 120 }
        enter: { at: "l1:'tap'", anim: pop }
        fx: [{ at: "l1:'Buy'", do: bump }]

  - id: path
    at: l2
    transition: push
    elements:
      - use: flow
        id: hops
        props:
          color: cyan
          accent: '{{accent}}'
          fontSize: 26
          token: { at: "l2:'DNS'", dur: 12, color: '{{accent}}' }
          stages:
            - { label: 'DNS', icon: globe, at: "l2:'DNS'" }
            - { label: 'CDN', icon: cloud, at: "l3:'CDN'" }
            - { label: 'LB', icon: queue, at: "l4:'load'" }
            - { label: 'API', icon: server, at: "l5:'API'" }
            - { label: 'DB', icon: db, at: "l5:'database'" }
        place: { x: 60, y: 80, w: 960, h: 300 }
        enter: { at: "l2:'First'", anim: fade }
      - use: chip
        id: static
        props: { text: 'Static files from nearby', icon: cloud, color: '{{accent}}', size: 32 }
        place: { x: 160, y: 440, w: 760, h: 96 }
        enter: { at: "l3:'static'", anim: pop }
      - use: chip
        id: healthy
        props: { text: 'Only healthy servers', icon: check, color: '{{accent}}', size: 32 }
        place: { x: 160, y: 570, w: 760, h: 96 }
        enter: { at: "l4:'healthy'", anim: pop }
      - use: chip
        id: back
        props: { text: 'Answer sent back', icon: refresh, color: '{{accent}}', size: 32 }
        place: { x: 160, y: 700, w: 760, h: 96 }
        enter: { at: "l5:'back'", anim: pop }

  - id: lesson
    at: l6
    transition: zoom
    elements:
      - use: title
        id: lesson_title
        props: { text: 'Fewer hops, **faster app**', size: 104, accent: '{{accent}}' }
        place: { x: 60, y: 200, w: 960, h: 300 }
        enter: { at: "l6:'hop'", anim: reveal }
      - use: icon
        id: bolt
        props: { name: bolt, color: '{{accent}}', ring: true }
        place: { x: 460, y: 580, w: 160, h: 160 }
        enter: { at: "l6:'faster'", anim: pop }

  - id: outro
    at: l7
    glow: '{{accent}}'
    transition: slide-up
    elements:
      - use: cta
        id: next
        props: { label: 'PART TWO', next: '{{next}}', keyword: '{{keyword}}', color: '{{accent}}', at: "l7:'part'" }
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l7:'Comment'", anim: rise }
