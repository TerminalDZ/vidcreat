# Tech · system design concept, Arabic (template; slots are filled by `reelforge new --pack tech`).
meta:
  id: '{{id}}'
  series: 'SYSTEM DESIGN'
  title: '{{concept}}'
  episode: 1
  preset: tiktok
  theme: default
  lang: ar-EG
  publish:
    cover: 'الـ API وقع؟'
    caption: '{{concept}} في دقيقة: {{component}} قدام الـ servers، و limit لكل client، و 429 للباقي، وفخ الـ counter المشترك.'
    hashtags: ['#systemdesign', '#backend', '#برمجة', '#مبرمجين']
    pinned: 'اكتب {{keyword}} في الكومنتات عشان الحلقة الجاية: {{next}}.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'الـ API بتاعك غرق في requests فجأة. تعمل إيه؟'
  - text: 'الحل ليه اسم، واسمه {{concept}}.'
  - text: 'الـ {{component}} بيقعد بين الـ clients والـ servers بتوعك.'
  - text: 'كل client مسموح له بـ {{limit}} {{unit}}، ومش أكتر.'
  - text: 'والـ requests الزيادة تستنى، أو ترجع 429 Too Many Requests.'
  - text: 'الفخ: خلي الـ counter في store مشترك، مش في الـ memory المحلية.'
  - text: 'اكتب {{keyword}} للحلقة الجاية: {{next}}.'

chapters:
  - { at: l1, label: '01 · المشكلة' }
  - { at: l2, label: '02 · الحل' }
  - { at: l6, label: '03 · الفخ' }

scenes:
  - id: hook
    at: l1
    glow: red
    elements:
      - use: node
        id: api
        props: { title: 'API', sub: 'api.example.com', icon: server, color: violet }
        place: { x: 330, y: 80, w: 420, h: 170 }
        enter: { at: "l1:'API'", anim: pop }
        states:
          - { at: "l1:'غرق'", set: { status: err, sub: '503 · down' } }
        fx:
          - { at: "l1:'غرق'", do: shake, amp: 16 }
      - use: title
        id: hook_title
        props: { text: 'Flooded **API**', size: 120, accent: red }
        place: { x: 60, y: 320, w: 960, h: 260 }
        enter: { at: "l1:'غرق'", anim: reveal }
      - use: particles
        id: flood
        props: { kind: herd, count: 70, dur: 1.8, color: red, at: "l1:'requests'", to: { x: 540, y: 165 } }

  - id: fix
    at: l2
    glow: '{{accent}}'
    transition: push
    elements:
      - use: label
        id: fix_label
        props: { text: 'الحل', dot: true, align: center }
        place: { x: 140, y: 200, w: 800, h: 60 }
        enter: { at: "l2:'الحل'", anim: wipe }
      - use: title
        id: concept
        props: { text: '**{{concept}}**', size: 100, accent: '{{accent}}' }
        place: { x: 60, y: 270, w: 960, h: 330 }
        enter: { at: "l2:'واسمه'", anim: reveal }

  - id: arch
    at: l3
    transition: push
    elements:
      - use: node
        id: clients
        props: { title: 'Clients', icon: users, color: cyan }
        place: { x: 270, y: 40, w: 540, h: 160 }
        enter: { at: "l3:'clients'", anim: pop }
      - use: node
        id: limiter
        props: { title: '{{component}}', icon: shield, color: '{{accent}}' }
        place: { x: 270, y: 280, w: 540, h: 160 }
        enter: { at: "l3:'بيقعد'", anim: pop }
      - use: node
        id: servers
        props: { title: 'Servers', icon: server, color: violet }
        place: { x: 270, y: 520, w: 540, h: 160 }
        enter: { at: "l3:'servers'", anim: pop }
      - use: arrow
        id: in
        props: { from: clients.bottom, to: limiter.top, color: cyan, packets: [{ at: "l4:'مسموح'", dur: 0.8 }] }
        enter: { at: "l3:'بيقعد'+0.3", anim: draw }
      - use: arrow
        id: out
        props: { from: limiter.bottom, to: servers.top, color: '{{accent}}', packets: [{ at: "l4:'مسموح'+0.8", dur: 0.8 }] }
        enter: { at: "l3:'servers'+0.3", anim: draw }
      - use: chip
        id: limit
        props: { text: '{{limit}} {{unit}} لكل client', icon: clock, color: '{{accent}}', size: 34 }
        place: { x: 160, y: 760, w: 760, h: 100 }
        enter: { at: "l4:'client'", anim: spring }
      - use: stamp
        id: tooMany
        layer: overlay
        props: { text: '429', color: red, size: 110 }
        place: { x: 620, y: 300, w: 380, h: 180 }
        enter: { at: "l5:'429'", anim: stamp }

  - id: trap
    at: l6
    glow: amber
    transition: zoom
    elements:
      - use: trap
        id: trap_card
        props: { sub: 'Local counters', until: "l6:'مشترك'" }
        enter: { at: "l6:'الفخ'", anim: glitch }
      - use: title
        id: shared
        props: { text: 'خلي الـ counter **مشترك**', size: 100, accent: '{{accent}}' }
        place: { x: 60, y: 190, w: 960, h: 320 }
        enter: { at: "l6:'مشترك'", anim: reveal }
      - use: chip
        id: local
        props: { text: 'مش في الـ memory المحلية', icon: x, color: red, size: 36, strike: "l6:'المحلية'+0.3" }
        place: { x: 160, y: 580, w: 760, h: 104 }
        enter: { at: "l6:'memory'", anim: pop }

  - id: outro
    at: l7
    glow: '{{accent}}'
    transition: slide-up
    elements:
      - use: cta
        id: next
        props:
          { next: '{{next}}', keyword: '{{keyword}}', prompt: 'اكتب في الكومنتات', color: '{{accent}}', at: "l7:'للحلقة'" }
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l7:'اكتب'", anim: rise }
