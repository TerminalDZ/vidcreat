# Tech · latency numbers (template; slots are filled by `reelforge new --pack tech`).
meta:
  id: '{{id}}'
  series: 'SYSTEM DESIGN'
  title: 'Latency percentiles'
  episode: 1
  preset: tiktok
  theme: default
  lang: en-US
  publish:
    cover: 'The average lies'
    caption: 'p50, p95 and p99 for {{service}}: why the average hides your slowest users. Example numbers from our own dashboards.'
    hashtags: ['#systemdesign', '#performance', '#backend', '#sre']
    pinned: 'Comment {{keyword}} and we will explain how to cut tail latency.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'Is your {{service}} fast? The average can lie to you.'
  - text: 'Half of all requests finish within {{p50}} milliseconds.'
  - text: 'But one in twenty takes {{p95}} milliseconds or more.'
  - text: 'And the slowest one percent waits {{p99}} milliseconds.'
  - text: 'Our target is {{target}} milliseconds for almost every request.'
  - text: 'So watch the p99, not the average, on your dashboards.'
  - text: 'Comment {{keyword}} and we will explain how to cut tail latency.'

chapters:
  - { at: l1, label: '01 · THE LIE' }
  - { at: l2, label: '02 · PERCENTILES' }
  - { at: l5, label: '03 · THE TARGET' }

scenes:
  - id: hook
    at: l1
    glow: '{{accent}}'
    camera: push-in
    elements:
      - use: node
        id: service
        props: { title: '{{service}}', sub: 'avg looks fine', icon: server, color: violet, status: ok }
        place: { x: 270, y: 80, w: 540, h: 170 }
        enter: { at: "l1:'fast'", anim: pop }
      - use: title
        id: hook_title
        props: { text: 'The average **lies**', size: 120, accent: '{{accent}}' }
        place: { x: 60, y: 330, w: 960, h: 260 }
        enter: { at: "l1:'average'", anim: reveal }
      - use: icon
        id: bolt
        props: { name: bolt, color: '{{accent}}', ring: true }
        place: { x: 460, y: 640, w: 160, h: 160 }
        enter: { at: "l1:'lie'", anim: pop }

  - id: bars
    at: l2
    transition: push
    elements:
      - use: bar-chart
        id: chart
        props:
          title: 'Latency (ms)'
          color: cyan
          accent: '{{accent}}'
          suffix: ' ms'
          focus: { index: 2, at: "l4:'slowest'" }
          bars:
            - { label: 'p50', value: {{p50}} }
            - { label: 'p95', value: {{p95}} }
            - { label: 'p99', value: {{p99}} }
        place: { x: 60, y: 20, w: 960, h: 520 }
        enter: { at: "l2:'Half'", anim: fade }
      - use: chip
        id: p95
        props: { text: 'p95: 1 in 20 requests', icon: users, color: amber, size: 32 }
        place: { x: 160, y: 590, w: 760, h: 96 }
        enter: { at: "l3:'twenty'", anim: pop }
      - use: chip
        id: p99
        props: { text: 'p99: the slowest 1%', icon: hourglass, color: red, size: 32 }
        place: { x: 160, y: 710, w: 760, h: 96 }
        enter: { at: "l4:'slowest'", anim: pop }

  - id: target
    at: l5
    transition: zoom
    elements:
      - use: stat-card
        id: target_card
        props: { label: 'Target', value: {{target}}, suffix: ' ms', icon: check, accent: '{{accent}}' }
        place: { x: 270, y: 80, w: 540, h: 300 }
        enter: { at: "l5:'target'", anim: rise }
      - use: title
        id: watch
        props: { text: 'Watch the **p99**', size: 112, accent: '{{accent}}' }
        place: { x: 60, y: 420, w: 860, h: 240 }
        enter: { at: "l6:'watch'", anim: reveal }

  - id: outro
    at: l7
    glow: '{{accent}}'
    transition: slide-up
    elements:
      - use: cta
        id: next
        props: { next: 'Cutting tail latency', keyword: '{{keyword}}', color: '{{accent}}', at: "l7:'explain'" }
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l7:'Comment'", anim: rise }
