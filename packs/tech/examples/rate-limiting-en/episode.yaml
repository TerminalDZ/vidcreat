        id: fix_label
        props: { text: 'The fix', dot: true, align: center }
        place: { x: 140, y: 200, w: 800, h: 60 }
        enter: { at: "l2:'fix'", anim: wipe }
      - use: title
        id: concept
        props: { text: '**Rate Limiting**', size: 116, accent: 'lime' }
        place: { x: 60, y: 280, w: 960, h: 300 }
        enter: { at: "l2:'called'", anim: reveal }

  - id: arch
    at: l3
    transition: push
    elements:
      - use: node
        id: clients
        props: { title: 'Clients', icon: users, color: cyan }
        place: { x: 270, y: 40, w: 540, h: 160 }
