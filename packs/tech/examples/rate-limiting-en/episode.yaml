        id: limiter
        props: { title: 'Rate limiter', icon: shield, color: 'lime' }
        place: { x: 270, y: 280, w: 540, h: 160 }
        enter: { at: "l3:'sits'", anim: pop }
      - use: node
        id: servers
        props: { title: 'Servers', icon: server, color: violet }
        place: { x: 270, y: 520, w: 540, h: 160 }
        enter: { at: "l3:'servers'", anim: pop }
      - use: arrow
        id: in
        props:
          { from: clients.bottom, to: limiter.top, color: cyan, packets: [{ at: "l4:'send'", dur: 0.8 }] }
        enter: { at: "l3:'sits'+0.3", anim: draw }
      - use: arrow
        id: out
        props:
          {
            from: limiter.bottom,
            to: servers.top,
            color: 'lime',
            packets: [{ at: "l4:'send'+0.8", dur: 0.8 }],
          }
        enter: { at: "l3:'servers'+0.3", anim: draw }
      - use: chip
        id: limit
        props: { text: '100 req/s per client', icon: clock, color: 'lime', size: 34 }
        place: { x: 160, y: 760, w: 760, h: 100 }
