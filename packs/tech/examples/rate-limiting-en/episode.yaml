meta:
  id: 'rate-limiting-en'
  series: 'SYSTEM DESIGN'
  title: 'Rate Limiting'
  episode: 1
  preset: tiktok
  theme: default
  lang: en-US
  publish:
    cover: 'Flooded API?'
    caption: 'Rate Limiting in one minute: a Rate limiter in front of your servers, a limit per client, a 429 for the rest, and the shared-counter trap.'
    hashtags: ['#systemdesign', '#backend', '#programming', '#softwareengineering']
    pinned: 'Comment CACHE for the next episode: Caching and stampedes.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'Your API just got flooded with requests. What now?'
  - text: 'The fix has a name, and it is called Rate Limiting.'
  - text: 'A Rate limiter sits between the clients and your servers.'
  - text: 'Each client may send 100 req/s, and not one more.'
  - text: 'Extra requests wait, or get a 429 Too Many Requests.'
  - text: 'The trap: keep the counter in a shared store, not in local memory.'
  - text: 'Comment CACHE for the next episode: Caching and stampedes.'

chapters:
  - { at: l1, label: '01 · THE PROBLEM' }
  - { at: l2, label: '02 · THE FIX' }
  - { at: l6, label: '03 · THE TRAP' }

scenes:
  - id: hook
    at: l1
    glow: red
    elements:
      - use: node
        id: api
        props: { title: 'API', sub: 'api.example.com', icon: server, color: violet }
        place: { x: 330, y: 80, w: 420, h: 170 }
        enter: { at: "l1:'API'", anim: pop }
        states:
          - { at: "l1:'flooded'", set: { status: err, sub: '503 · down' } }
        fx:
          - { at: "l1:'flooded'", do: shake, amp: 16 }
      - use: title
        id: hook_title
        props: { text: 'Flooded **API**', size: 120, accent: red }
        place: { x: 60, y: 320, w: 960, h: 260 }
        enter: { at: "l1:'flooded'", anim: reveal }
      - use: particles
