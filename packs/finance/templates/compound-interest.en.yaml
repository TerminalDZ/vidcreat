# Finance · compound interest (template; slots are filled by `reelforge new --pack finance`).
meta:
  id: '{{id}}'
  series: 'MONEY BASICS'
  title: 'Compound interest'
  episode: 1
  preset: tiktok
  theme: ledger
  lang: en-US
  publish:
    cover: 'Interest on interest'
    caption: 'What compound interest is, with one example. Real rates change and products have fees and risks. General information, not financial advice.'
    hashtags: ['#moneybasics', '#compoundinterest', '#personalfinance']
    pinned: 'General information, not financial advice. Ask a licensed adviser about your own situation.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'How can a small amount grow just by waiting? It is called compound interest.'
  - text: 'You earn interest on your savings, and then interest on that interest.'
  - text: 'Here is an example: {{start}} {{currency}} at {{rate}} percent a year.'
  - text: 'After {{years}} years, it could become about {{end}} {{currency}}.'
  - text: 'Real rates change, and products can have fees and risks.'
  - text: 'Ask a licensed adviser before you decide anything about your money.'
  - text: 'General information, not financial advice. Follow {{org}} for more basics.'

chapters:
  - { at: l1, label: '01 · THE IDEA' }
  - { at: l3, label: '02 · AN EXAMPLE' }
  - { at: l5, label: '03 · KEEP IN MIND' }

scenes:
  - id: hook
    at: l1
    glow: '{{accent}}'
    camera: push-in
    elements:
      - use: icon
        id: hook_icon
        props: { name: refresh, color: '{{accent}}', ring: true }
        place: { x: 460, y: 120, w: 160, h: 160 }
        enter: { at: "l1:'small'", anim: pop }
      - use: title
        id: hook_title
        props: { text: 'Compound **interest**', size: 112, accent: '{{accent}}' }
        place: { x: 60, y: 320, w: 960, h: 280 }
        enter: { at: "l1:'compound'", anim: reveal }
      - use: chip
        id: idea
        props: { text: 'Interest on interest', icon: refresh, color: '{{accent}}', size: 38 }
        place: { x: 190, y: 680, w: 700, h: 104 }
        enter: { at: "l2:'that'", anim: spring }

  - id: example
    at: l3
    transition: zoom
    elements:
      - use: label
        id: example_label
        props: { text: 'Example values · {{rate}}% a year', dot: true, align: center }
        place: { x: 100, y: 120, w: 880, h: 60 }
        enter: { at: "l3:'example'", anim: wipe }
      - use: counter
        id: amount
        props:
          from: {{start}}
          keyframes: [{ at: "l4:'become'", value: {{end}}, dur: 1.6 }]
          suffix: ' {{currency}}'
          label: 'EXAMPLE AMOUNT'
          color: '{{accent}}'
          size: 120
        place: { x: 60, y: 210, w: 960, h: 320 }
        enter: { at: "l3:'example'+0.3", anim: pop }
      - use: chip
        id: years
        props: { text: '{{years}} years later', icon: clock, color: '{{accent}}', size: 38 }
        place: { x: 240, y: 600, w: 600, h: 104 }
        enter: { at: "l4:'After'", anim: spring }

  - id: risks
    at: l5
    glow: amber
    transition: push
    elements:
      - use: chip
        id: rates
        props: { text: 'Rates change', icon: refresh, color: amber, size: 30 }
        place: { x: 60, y: 120, w: 400, h: 90 }
        enter: { at: "l5:'rates'", anim: pop }
      - use: chip
        id: fees
        props: { text: 'Fees', icon: card, color: amber, size: 30 }
        place: { x: 500, y: 120, w: 240, h: 90 }
        enter: { at: "l5:'fees'", anim: pop }
      - use: chip
        id: riskchip
        props: { text: 'Risks', icon: warn, color: amber, size: 30 }
        place: { x: 780, y: 120, w: 240, h: 90 }
        enter: { at: "l5:'risks'", anim: pop }
      - use: title
        id: adviser
        props: { text: 'Ask a **licensed adviser**', size: 100, accent: '{{accent}}' }
        place: { x: 60, y: 300, w: 960, h: 300 }
        enter: { at: "l6:'licensed'", anim: reveal }

  - id: outro
    at: l7
    transition: slide-up
    elements:
      - use: label
        id: disclaimer
        props: { text: 'General information, not financial advice', dot: true, align: center }
        place: { x: 60, y: 80, w: 960, h: 60 }
        enter: { at: "l7:'General'", anim: wipe }
      - use: cta
        id: next
        props: { label: 'FOLLOW FOR MORE', next: 'More money basics', color: '{{accent}}' }
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l7:'Follow'", anim: rise }
