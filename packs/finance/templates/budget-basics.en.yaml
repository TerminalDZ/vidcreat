# Finance · budget basics (template; slots are filled by `reelforge new --pack finance`).
meta:
  id: '{{id}}'
  series: 'MONEY BASICS'
  title: 'Budget basics'
  episode: 1
  preset: tiktok
  theme: ledger
  lang: en-US
  publish:
    cover: 'Where does your money go?'
    caption: 'One simple way to split a monthly income into needs, wants and savings, with example values. General information, not financial advice.'
    hashtags: ['#moneybasics', '#budgeting', '#personalfinance', '#savings']
    pinned: 'General information, not financial advice. Comment {{keyword}} for part two.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'Where does your money go each month? Here is one simple way to split it.'
  - text: 'Take an example income of {{income}} {{currency}} a month.'
  - text: 'About {{needs}} percent goes to needs, like rent, food and transport.'
  - text: 'Then {{wants}} percent goes to wants, like eating out or hobbies.'
  - text: 'And {{savings}} percent goes to savings, before you spend the rest.'
  - text: 'These are example values, and your own split depends on your situation.'
  - text: 'General information, not financial advice. Comment {{keyword}} for part two.'

chapters:
  - { at: l1, label: '01 · THE QUESTION' }
  - { at: l3, label: '02 · THE SPLIT' }
  - { at: l6, label: '03 · YOUR CASE' }

scenes:
  - id: hook
    at: l1
    glow: '{{accent}}'
    camera: push-in
    elements:
      - use: label
        id: org
        props: { text: 'Money basics · {{org}}', dot: true, align: center }
        place: { x: 100, y: 170, w: 880, h: 60 }
        enter: { at: "l1:'Where'", anim: wipe }
      - use: title
        id: hook_title
        props: { text: 'Where does your **money** go?', size: 104, accent: '{{accent}}' }
        place: { x: 60, y: 250, w: 960, h: 320 }
        enter: { at: "l1:'money'", anim: reveal }
      - use: icon
        id: hook_icon
        props: { name: card, color: '{{accent}}', ring: true }
        place: { x: 460, y: 640, w: 160, h: 160 }
        enter: { at: "l1:'split'", anim: pop }

  - id: income
    at: l2
    transition: zoom
    elements:
      - use: counter
        id: income_count
        props:
          from: 0
          keyframes: [{ at: "l2:'income'", value: {{income}}, dur: 1.2 }]
          suffix: ' {{currency}}'
          label: 'EXAMPLE MONTHLY INCOME'
          color: '{{accent}}'
          size: 120
        place: { x: 60, y: 160, w: 960, h: 320 }
        enter: { at: "l2:'example'", anim: pop }
      - use: chip
        id: example
        props: { text: 'Example values', icon: warn, color: dim, size: 34 }
        place: { x: 290, y: 580, w: 500, h: 96 }
        enter: { at: "l2:'month'", anim: fade }

  - id: split
    at: l3
    transition: push
    elements:
      - use: donut-chart
        id: donut
        props:
          color: '{{accent}}'
          value: '{{income}}'
          label: '{{currency}} · example'
          show: percent
          segments:
            - { label: 'Needs', value: {{needs}}, color: cyan }
            - { label: 'Wants', value: {{wants}}, color: amber }
            - { label: 'Savings', value: {{savings}}, color: '{{accent}}' }
        place: { x: 60, y: 20, w: 960, h: 520 }
        enter: { at: "l3:'needs'", anim: fade }
      - use: chip
        id: needs
        props: { text: 'Needs: rent, food, transport', icon: key, color: cyan, size: 32 }
        place: { x: 160, y: 580, w: 760, h: 96 }
        enter: { at: "l3:'rent'", anim: pop }
      - use: chip
        id: wants
        props: { text: 'Wants: eating out, hobbies', icon: cart, color: amber, size: 32 }
        place: { x: 160, y: 700, w: 760, h: 96 }
        enter: { at: "l4:'wants'", anim: pop }
      - use: chip
        id: savings
        props: { text: 'Savings come first', icon: lock, color: '{{accent}}', size: 32 }
        place: { x: 160, y: 820, w: 760, h: 96 }
        enter: { at: "l5:'savings'", anim: pop }

  - id: yours
    at: l6
    transition: zoom
    elements:
      - use: title
        id: yours_title
        props: { text: 'Your split **depends on you**', size: 100, accent: '{{accent}}' }
        place: { x: 60, y: 200, w: 960, h: 300 }
        enter: { at: "l6:'example'", anim: reveal }
      - use: icon
        id: yours_icon
        props: { name: user, color: '{{accent}}', ring: true }
        place: { x: 460, y: 580, w: 160, h: 160 }
        enter: { at: "l6:'situation'", anim: pop }

  - id: outro
    at: l7
    transition: slide-up
    elements:
      - use: label
        id: disclaimer
        props: { text: 'General information, not financial advice', dot: true, align: center }
        place: { x: 60, y: 80, w: 960, h: 60 }
        enter: { at: "l7:'General'", anim: wipe }
      - use: cta
        id: next
        props:
          label: 'PART TWO'
          next: 'Building a savings habit'
          keyword: '{{keyword}}'
          color: '{{accent}}'
          at: "l7:'part'"
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l7:'Comment'", anim: rise }
