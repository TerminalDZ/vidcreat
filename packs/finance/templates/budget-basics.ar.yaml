# Finance · budget basics, Arabic (template; slots are filled by `reelforge new --pack finance`).
meta:
  id: '{{id}}'
  series: 'أساسيات المال'
  title: 'أساسيات الميزانية'
  episode: 1
  preset: tiktok
  theme: ledger
  lang: ar-EG
  publish:
    cover: 'فلوسك بتروح فين؟'
    caption: 'طريقة بسيطة لتقسيم الدخل الشهري بين احتياجات ورغبات وادخار، بقيم توضيحية. معلومات عامة وليست نصيحة مالية.'
    hashtags: ['#أساسيات_المال', '#ميزانية', '#ادخار', '#personalfinance']
    pinned: 'معلومات عامة وليست نصيحة مالية. اكتب {{keyword}} للجزء التاني.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'فلوسك بتروح فين كل شهر؟ دي طريقة بسيطة تقسمها بيها.'
  - text: 'خلينا ناخد مثال لدخل {{income}} {{currency}} في الشهر.'
  - text: 'حوالي {{needs}} في المية للاحتياجات، زي الإيجار والأكل والمواصلات.'
  - text: 'وبعدها {{wants}} في المية للرغبات، زي الخروجات والهوايات.'
  - text: 'و{{savings}} في المية للادخار، قبل ما تصرف الباقي.'
  - text: 'دي قيم توضيحية، والتقسيم المناسب ليك بيعتمد على ظروفك.'
  - text: 'معلومات عامة وليست نصيحة مالية. اكتب {{keyword}} للجزء التاني.'

chapters:
  - { at: l1, label: '01 · السؤال' }
  - { at: l3, label: '02 · التقسيم' }
  - { at: l6, label: '03 · ظروفك' }

scenes:
  - id: hook
    at: l1
    glow: '{{accent}}'
    camera: push-in
    elements:
      - use: label
        id: org
        props: { text: 'أساسيات المال · {{org}}', dot: true, align: center }
        place: { x: 100, y: 170, w: 880, h: 60 }
        enter: { at: "l1:'فلوسك'", anim: wipe }
      - use: title
        id: hook_title
        props: { text: '**فلوسك** بتروح فين؟', size: 100, accent: '{{accent}}' }
        place: { x: 60, y: 240, w: 960, h: 340 }
        enter: { at: "l1:'بتروح'", anim: reveal }
      - use: icon
        id: hook_icon
        props: { name: card, color: '{{accent}}', ring: true }
        place: { x: 460, y: 640, w: 160, h: 160 }
        enter: { at: "l1:'تقسمها'", anim: pop }

  - id: income
    at: l2
    transition: zoom
    elements:
      - use: counter
        id: income_count
        props:
          from: 0
          keyframes: [{ at: "l2:'لدخل'", value: {{income}}, dur: 1.2 }]
          suffix: ' {{currency}}'
          label: 'دخل شهري · مثال'
          color: '{{accent}}'
          size: 120
        place: { x: 60, y: 160, w: 960, h: 320 }
        enter: { at: "l2:'مثال'", anim: pop }
      - use: chip
        id: example
        props: { text: 'قيم توضيحية', icon: warn, color: dim, size: 34 }
        place: { x: 290, y: 580, w: 500, h: 96 }
        enter: { at: "l2:'الشهر'", anim: fade }

  - id: split
    at: l3
    transition: push
    elements:
      - use: donut-chart
        id: donut
        props:
          color: '{{accent}}'
          value: '{{income}}'
          label: '{{currency}} · مثال'
          show: percent
          segments:
            - { label: 'احتياجات', value: {{needs}}, color: cyan }
            - { label: 'رغبات', value: {{wants}}, color: amber }
            - { label: 'ادخار', value: {{savings}}, color: '{{accent}}' }
        place: { x: 60, y: 20, w: 960, h: 520 }
        enter: { at: "l3:'للاحتياجات'", anim: fade }
      - use: chip
        id: needs
        props: { text: 'احتياجات: إيجار وأكل ومواصلات', icon: key, color: cyan, size: 32 }
        place: { x: 160, y: 580, w: 760, h: 96 }
        enter: { at: "l3:'الإيجار'", anim: pop }
      - use: chip
        id: wants
        props: { text: 'رغبات: خروجات وهوايات', icon: cart, color: amber, size: 32 }
        place: { x: 160, y: 700, w: 760, h: 96 }
        enter: { at: "l4:'للرغبات'", anim: pop }
      - use: chip
        id: savings
        props: { text: 'الادخار الأول', icon: lock, color: '{{accent}}', size: 32 }
        place: { x: 160, y: 820, w: 760, h: 96 }
        enter: { at: "l5:'للادخار'", anim: pop }

  - id: yours
    at: l6
    transition: zoom
    elements:
      - use: title
        id: yours_title
        props: { text: 'التقسيم **حسب ظروفك**', size: 100, accent: '{{accent}}' }
        place: { x: 60, y: 200, w: 960, h: 320 }
        enter: { at: "l6:'توضيحية'", anim: reveal }
      - use: icon
        id: yours_icon
        props: { name: user, color: '{{accent}}', ring: true }
        place: { x: 460, y: 580, w: 160, h: 160 }
        enter: { at: "l6:'ظروفك'", anim: pop }

  - id: outro
    at: l7
    transition: slide-up
    elements:
      - use: label
        id: disclaimer
        props: { text: 'معلومات عامة وليست نصيحة مالية', dot: true, align: center }
        place: { x: 60, y: 80, w: 960, h: 60 }
        enter: { at: "l7:'معلومات'", anim: wipe }
      - use: cta
        id: next
        props:
          label: 'الجزء التاني'
          prompt: 'اكتب في الكومنتات'
          next: 'إزاي تبني عادة الادخار'
          keyword: '{{keyword}}'
          color: '{{accent}}'
          at: "l7:'للجزء'"
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l7:'اكتب'", anim: rise }
