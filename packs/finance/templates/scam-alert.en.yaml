# Finance · scam alert (template; slots are filled by `reelforge new --pack finance`).
meta:
  id: '{{id}}'
  series: 'STAY SAFE'
  title: 'Spot a fake bank message'
  episode: 1
  preset: tiktok
  theme: ledger
  lang: en-US
  publish:
    cover: 'Real message or scam?'
    caption: 'Three signs of a fake bank message and what to do instead. {{org}} will never ask for your password or one-time code. General information.'
    hashtags: ['#scamalert', '#fraud', '#onlinesafety', '#banking']
    pinned: 'Comment {{keyword}} and share this with someone who should see it.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'A message says your account is locked. Is it real, or is it a scam?'
  - text: 'Scammers often pretend to be {{org}}, and the text looks official.'
  - text: 'Watch for three signs: urgency, a strange link, and a request for codes.'
  - text: 'Your bank will never ask for your password or a one-time code.'
  - text: 'So do not click. Call the number on the back of your card instead.'
  - text: 'If you already shared something, contact your bank right away.'
  - text: 'General information. Comment {{keyword}} and share this with your family.'

chapters:
  - { at: l1, label: '01 · THE MESSAGE' }
  - { at: l3, label: '02 · THE SIGNS' }
  - { at: l5, label: '03 · WHAT TO DO' }

scenes:
  - id: hook
    at: l1
    glow: '{{danger}}'
    elements:
      - use: phone
        id: phone
        props:
          title: 'Messages'
          button: 'Open link'
          notifications:
            - { title: '{{org}}', text: '{{lure}}', at: "l1:'locked'", color: '{{danger}}', icon: warn }
        place: { x: 60, y: 60, w: 440, h: 860 }
        enter: { at: "l1:'message'", anim: rise }
      - use: stamp
        id: scam
        props: { text: 'SCAM?', color: '{{danger}}', size: 110 }
        place: { x: 540, y: 120, w: 460, h: 220 }
        enter: { at: "l1:'scam'", anim: stamp }
      - use: chip
        id: fake
        props: { text: 'Fake sender', icon: x, color: '{{danger}}', size: 34 }
        place: { x: 540, y: 420, w: 420, h: 96 }
        enter: { at: "l2:'pretend'", anim: pop }

  - id: signs
    at: l3
    transition: push
    elements:
      - use: label
        id: signs_label
        props: { text: 'Three warning signs', dot: true, align: center }
        place: { x: 140, y: 130, w: 800, h: 60 }
        enter: { at: "l3:'Watch'", anim: wipe }
      - use: checklist
        id: signs_list
        props:
          color: '{{danger}}'
          fontSize: 56
          items:
            - { text: 'Urgency', at: "l3:'urgency'", ok: false }
            - { text: 'A strange link', at: "l3:'link'", ok: false }
            - { text: 'Asks for codes', at: "l3:'codes'", ok: false }
        place: { x: 140, y: 230, w: 780, h: 420 }
        enter: { at: "l3:'signs'", anim: rise }

  - id: never
    at: l4
    transition: zoom
    elements:
      - use: title
        id: never_title
        props: { text: 'Your bank will **never** ask', size: 100, accent: '{{accent}}' }
        place: { x: 60, y: 160, w: 960, h: 300 }
        enter: { at: "l4:'never'", anim: reveal }
      - use: chip
        id: password
        props: { text: 'Password', icon: lock, color: '{{danger}}', size: 36, strike: "l4:'code'+0.4" }
        place: { x: 80, y: 540, w: 380, h: 100 }
        enter: { at: "l4:'password'", anim: pop }
      - use: chip
        id: otp
        props: { text: 'One-time code', icon: key, color: '{{danger}}', size: 36, strike: "l4:'code'+0.6" }
        place: { x: 500, y: 540, w: 420, h: 100 }
        enter: { at: "l4:'code'", anim: pop }

  - id: act
    at: l5
    glow: '{{accent}}'
    transition: push
    elements:
      - use: chip
        id: noclick
        props: { text: 'Do not click', icon: x, color: '{{danger}}', size: 40 }
        place: { x: 240, y: 120, w: 600, h: 104 }
        enter: { at: "l5:'click'", anim: pop }
      - use: title
        id: call
        props: { text: 'Call the number **on your card**', size: 92, accent: '{{accent}}' }
        place: { x: 60, y: 270, w: 960, h: 300 }
        enter: { at: "l5:'Call'", anim: reveal }
      - use: chip
        id: shared
        props: { text: 'Already shared? Contact your bank now', icon: phone, color: '{{accent}}', size: 30 }
        place: { x: 60, y: 660, w: 860, h: 100 }
        enter: { at: "l6:'already'", anim: spring }

  - id: outro
    at: l7
    transition: slide-up
    elements:
      - use: cta
        id: next
        props:
          label: 'SHARE IT'
          next: 'Keep your family safe'
          keyword: '{{keyword}}'
          color: '{{accent}}'
          at: "l7:'share'"
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l7:'Comment'", anim: rise }
