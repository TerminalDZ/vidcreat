# Food · a dish in 4 steps, Arabic (template; slots are filled by `reelforge new --pack food`).
meta:
  id: '{{id}}'
  series: 'من مطبخنا'
  title: '{{dish}}'
  episode: 1
  preset: tiktok
  theme: bistro
  lang: ar-EG
  publish:
    cover: '{{dish}} في 4 خطوات'
    caption: 'إزاي بنعمل {{dish}} في {{org}}، من البداية للطبق. اسأل الفريق عن مسببات الحساسية.'
    hashtags: ['#أكل', '#وصفات', '#مطبخ', '#مطاعم']
    pinned: 'اكتب {{keyword}} ونحجزلك ترابيزة الأسبوع ده.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'إزاي بنعمل {{dish}} في {{org}}؟ أربع خطوات من البداية للطبق.'
  - text: 'بنبدأ بالخطوة الأولى: {{step1}}.'
  - text: 'وبعدها الخطوة التانية: {{step2}}.'
  - text: 'الخطوة التالتة هي اللي بتبني الطعم: {{step3}}.'
  - text: 'وفي الآخر، الخطوة الرابعة: {{step4}}.'
  - text: 'من البداية للطبق حوالي {{minutes}} دقيقة. واسأل الفريق عن مسببات الحساسية.'
  - text: 'اكتب {{keyword}} في الكومنتات ونحجزلك ترابيزة الأسبوع ده.'

chapters:
  - { at: l1, label: '01 · الطبق' }
  - { at: l2, label: '02 · أربع خطوات' }
  - { at: l6, label: '03 · على الترابيزة' }

scenes:
  - id: hook
    at: l1
    glow: '{{accent}}'
    camera: push-in
    elements:
      - use: label
        id: org
        props: { text: '{{org}}', dot: true, align: center }
        place: { x: 140, y: 170, w: 800, h: 60 }
        enter: { at: "l1:'إزاي'", anim: wipe }
      - use: title
        id: dish
        props: { text: '**{{dish}}**', size: 104, accent: '{{accent}}' }
        place: { x: 60, y: 240, w: 960, h: 340 }
        enter: { at: 'l1+0.8', anim: reveal }
      - use: chip
        id: four
        props: { text: '4 خطوات للطبق', icon: fire, color: '{{accent}}', size: 38 }
        place: { x: 190, y: 620, w: 700, h: 104 }
        enter: { at: "l1:'أربع'", anim: spring }

  - id: steps
    at: l2
    transition: push
    elements:
      - use: node
        id: s1
        props: { title: '{{step1}}', sub: 'الخطوة 1', icon: fire, color: '{{accent}}' }
        place: { x: 60, y: 20, w: 860, h: 170 }
        enter: { at: "l2:'الأولى'", anim: slide-l }
      - use: node
        id: s2
        props: { title: '{{step2}}', sub: 'الخطوة 2', icon: refresh, color: '{{accent}}' }
        place: { x: 60, y: 210, w: 860, h: 170 }
        enter: { at: "l3:'التانية'", anim: slide-l }
      - use: node
        id: s3
        props: { title: '{{step3}}', sub: 'الخطوة 3', icon: hourglass, color: '{{accent}}' }
        place: { x: 60, y: 400, w: 860, h: 170 }
        enter: { at: "l4:'الطعم'", anim: slide-l }
      - use: node
        id: s4
        props: { title: '{{step4}}', sub: 'الخطوة 4', icon: check, color: lime, status: ok }
        place: { x: 60, y: 590, w: 860, h: 170 }
        enter: { at: "l5:'الرابعة'", anim: slide-l }

  - id: time
    at: l6
    transition: zoom
    elements:
      - use: counter
        id: minutes
        props:
          from: 0
          keyframes: [{ at: "l6:'حوالي'", value: {{minutes}}, dur: 1 }]
          suffix: ' دقيقة'
          label: 'من البداية للطبق'
          color: '{{accent}}'
        place: { x: 140, y: 160, w: 800, h: 320 }
        enter: { at: "l6:'البداية'", anim: pop }
      - use: chip
        id: allergens
        props: { text: 'اسأل عن مسببات الحساسية', icon: warn, color: '{{accent}}', size: 32 }
        place: { x: 120, y: 580, w: 800, h: 100 }
        enter: { at: "l6:'الحساسية'", anim: spring }

  - id: outro
    at: l7
    transition: slide-up
    elements:
      - use: cta
        id: next
        props:
          label: 'احجز ترابيزة'
          prompt: 'اكتب في الكومنتات'
          next: '{{dish}} في {{org}}'
          keyword: '{{keyword}}'
          color: '{{accent}}'
          at: "l7:'ونحجزلك'"
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l7:'اكتب'", anim: rise }
