# Food · weekly specials (template; slots are filled by `reelforge new --pack food`).
meta:
  id: '{{id}}'
  series: 'THIS WEEK'
  title: 'Weekly specials'
  episode: 1
  preset: tiktok
  theme: bistro
  lang: en-US
  publish:
    cover: '3 specials this week'
    caption: 'This week at {{org}}: {{dish1}} on {{day1}}, {{dish2}} on {{day2}} and {{dish3}} on {{day3}}. While they last; ask our staff about allergens.'
    hashtags: ['#weeklyspecials', '#foodtok', '#restaurant', '#menu']
    pinned: 'Comment {{keyword}} to get the menu every week.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'What is cooking at {{org}} this week? Here are three specials.'
  - text: 'Kicking off on {{day1}}, we serve {{dish1}}.'
  - text: 'Midweek, on {{day2}}, come and try our {{dish2}}.'
  - text: 'And on {{day3}}, the chef cooks {{dish3}}.'
  - text: 'Specials are only available while they last, so come early.'
  - text: 'Ask our staff about allergens and ingredients.'
  - text: 'Comment {{keyword}} to get the menu every week.'

chapters:
  - { at: l1, label: '01 · THIS WEEK' }
  - { at: l2, label: '02 · THE SPECIALS' }
  - { at: l5, label: '03 · GOOD TO KNOW' }

scenes:
  - id: hook
    at: l1
    glow: '{{accent}}'
    camera: push-in
    elements:
      - use: label
        id: org
        props: { text: '{{org}}', dot: true, align: center }
        place: { x: 140, y: 170, w: 800, h: 60 }
        enter: { at: "l1:'What'", anim: wipe }
      - use: title
        id: hook_title
        props: { text: 'This week''s **specials**', size: 108, accent: '{{accent}}' }
        place: { x: 60, y: 250, w: 960, h: 300 }
        enter: { at: "l1:'cooking'", anim: reveal }
      - use: icon
        id: fire
        props: { name: fire, color: '{{accent}}', ring: true }
        place: { x: 460, y: 640, w: 160, h: 160 }
        enter: { at: "l1:'three'", anim: pop }

  - id: specials
    at: l2
    transition: push
    elements:
      - use: timeline
        id: week
        props:
          color: '{{accent}}'
          markers:
            - { pos: 0.12, label: '{{day1}}', at: "l2:'Kicking'" }
            - { pos: 0.5, label: '{{day2}}', at: "l3:'Midweek'" }
            - { pos: 0.88, label: '{{day3}}', at: "l4:'chef'" }
          cursor:
            - { at: "l2:'Kicking'", pos: 0.12, dur: 0.6 }
            - { at: "l3:'Midweek'", pos: 0.5, dur: 0.8 }
            - { at: "l4:'chef'", pos: 0.88, dur: 0.8 }
        place: { x: 60, y: 120, w: 960, h: 260 }
        enter: { at: "l2:'Kicking'", anim: wipe }
      - use: chip
        id: dish1
        props: { text: '{{dish1}}', icon: fire, color: '{{accent}}', size: 42, variant: solid }
        place: { x: 160, y: 480, w: 760, h: 120 }
        enter: { at: "l2:'serve'", anim: pop }
        exit: { at: l3, anim: fade }
      - use: chip
        id: dish2
        props: { text: '{{dish2}}', icon: fire, color: '{{accent}}', size: 42, variant: solid }
        place: { x: 160, y: 480, w: 760, h: 120 }
        enter: { at: "l3:'try'", anim: pop }
        exit: { at: l4, anim: fade }
      - use: chip
        id: dish3
        props: { text: '{{dish3}}', icon: fire, color: '{{accent}}', size: 42, variant: solid }
        place: { x: 160, y: 480, w: 760, h: 120 }
        enter: { at: "l4:'cooks'", anim: pop }

  - id: notes
    at: l5
    transition: zoom
    elements:
      - use: title
        id: last
        props: { text: 'While they **last**', size: 112, accent: '{{accent}}' }
        place: { x: 60, y: 180, w: 960, h: 280 }
        enter: { at: "l5:'Specials'", anim: reveal }
      - use: chip
        id: early
        props: { text: 'Come early', icon: clock, color: '{{accent}}', size: 38 }
        place: { x: 290, y: 500, w: 500, h: 100 }
        enter: { at: "l5:'early'", anim: spring }
      - use: chip
        id: allergens
        props: { text: 'Ask our staff about allergens', icon: warn, color: dim, size: 32 }
        place: { x: 120, y: 660, w: 800, h: 100 }
        enter: { at: "l6:'allergens'", anim: pop }

  - id: outro
    at: l7
    transition: slide-up
    elements:
      - use: cta
        id: next
        props:
          label: 'EVERY WEEK'
          next: 'Next week''s menu'
          keyword: '{{keyword}}'
          color: '{{accent}}'
          at: "l7:'menu'"
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l7:'Comment'", anim: rise }
