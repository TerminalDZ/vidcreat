# Food · a dish in 4 steps (template; slots are filled by `reelforge new --pack food`).
meta:
  id: '{{id}}'
  series: 'FROM OUR KITCHEN'
  title: '{{dish}}'
  episode: 1
  preset: tiktok
  theme: bistro
  lang: en-US
  publish:
    cover: '{{dish}} in 4 steps'
    caption: 'How we make our {{dish}} at {{org}}, start to plate. Ask our staff about allergens.'
    hashtags: ['#foodtok', '#recipe', '#kitchen', '#restaurant']
    pinned: 'Comment {{keyword}} and we will save you a table this week.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'How do we make our {{dish}} at {{org}}? Four steps, start to plate.'
  - text: 'We start with step one: {{step1}}.'
  - text: 'Then comes step two: {{step2}}.'
  - text: 'Step three is where the flavor builds: {{step3}}.'
  - text: 'And to finish, step four: {{step4}}.'
  - text: 'From start to plate it takes about {{minutes}} minutes. Ask our staff about allergens.'
  - text: 'Comment {{keyword}} and we will save you a table this week.'

chapters:
  - { at: l1, label: '01 · THE DISH' }
  - { at: l2, label: '02 · FOUR STEPS' }
  - { at: l6, label: '03 · ON THE TABLE' }

scenes:
  - id: hook
    at: l1
    glow: '{{accent}}'
    camera: push-in
    elements:
      - use: label
        id: org
        props: { text: '{{org}}', dot: true, align: center }
        place: { x: 140, y: 170, w: 800, h: 60 }
        enter: { at: "l1:'How'", anim: wipe }
      - use: title
        id: dish
        props: { text: '**{{dish}}**', size: 112, accent: '{{accent}}' }
        place: { x: 60, y: 250, w: 960, h: 300 }
        enter: { at: 'l1+0.8', anim: reveal }
      - use: chip
        id: four
        props: { text: '4 steps, start to plate', icon: fire, color: '{{accent}}', size: 38 }
        place: { x: 190, y: 620, w: 700, h: 104 }
        enter: { at: "l1:'Four'", anim: spring }

  - id: steps
    at: l2
    transition: push
    elements:
      - use: node
        id: s1
        props: { title: '{{step1}}', sub: 'Step 1', icon: fire, color: '{{accent}}' }
        place: { x: 60, y: 20, w: 860, h: 170 }
        enter: { at: "l2:'one'", anim: slide-r }
      - use: node
        id: s2
        props: { title: '{{step2}}', sub: 'Step 2', icon: refresh, color: '{{accent}}' }
        place: { x: 60, y: 210, w: 860, h: 170 }
        enter: { at: "l3:'two'", anim: slide-r }
      - use: node
        id: s3
        props: { title: '{{step3}}', sub: 'Step 3', icon: hourglass, color: '{{accent}}' }
        place: { x: 60, y: 400, w: 860, h: 170 }
        enter: { at: "l4:'flavor'", anim: slide-r }
      - use: node
        id: s4
        props: { title: '{{step4}}', sub: 'Step 4', icon: check, color: lime, status: ok }
        place: { x: 60, y: 590, w: 860, h: 170 }
        enter: { at: "l5:'four'", anim: slide-r }

  - id: time
    at: l6
    transition: zoom
    elements:
      - use: counter
        id: minutes
        props:
          from: 0
          keyframes: [{ at: "l6:'about'", value: {{minutes}}, dur: 1 }]
          suffix: ' min'
          label: 'START TO PLATE'
          color: '{{accent}}'
        place: { x: 140, y: 160, w: 800, h: 320 }
        enter: { at: "l6:'start'", anim: pop }
      - use: chip
        id: allergens
        props: { text: 'Ask our staff about allergens', icon: warn, color: '{{accent}}', size: 32 }
        place: { x: 120, y: 580, w: 800, h: 100 }
        enter: { at: "l6:'allergens'", anim: spring }

  - id: outro
    at: l7
    transition: slide-up
    elements:
      - use: cta
        id: next
        props:
          label: 'SAVE A TABLE'
          next: '{{dish}} at {{org}}'
          keyword: '{{keyword}}'
          color: '{{accent}}'
          at: "l7:'save'"
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l7:'Comment'", anim: rise }
