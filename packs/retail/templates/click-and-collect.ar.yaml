# Retail · click and collect, Arabic (template; slots are filled by `reelforge new --pack retail`).
meta:
  id: '{{id}}'
  series: 'خدمات المتجر'
  title: 'اطلب واستلم'
  episode: 1
  preset: tiktok
  theme: retail
  lang: ar-EG
  publish:
    cover: 'اطلب أونلاين واستلم النهارده'
    caption: 'إزاي تستلم طلبك من {{org}}: اطلب أونلاين، استنى رسالتنا، ووري الكود في {{store}}. المواعيد ممكن تتأخر في أيام الزحمة.'
    hashtags: ['#تسوق', '#اطلب_واستلم', '#متاجر', '#retail']
    pinned: 'اكتب {{keyword}} لدليل الاسترجاع.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'طلبت أونلاين من {{org}}؟ استلمه في حوالي {{hours}} ساعات.'
  - text: 'في صفحة الدفع، اختار click and collect، وبعدين اختار الفرع.'
  - text: 'هنبعتلك رسالة أول ما الشنطة تبقى جاهزة.'
  - text: 'تعالى للكاونتر في {{store}} ووري الكود بتاعك.'
  - text: 'راجع المنتجات هناك، وفي دقيقة تكون خلصت.'
  - text: 'المواعيد ممكن تتغير في أيام الزحمة، فاستنى رسالتنا قبل ما تيجي.'
  - text: 'اكتب {{keyword}} وتابعنا عشان دليل الاسترجاع.'

chapters:
  - { at: l1, label: '01 · الوعد' }
  - { at: l2, label: '02 · بتشتغل إزاي' }
  - { at: l6, label: '03 · خلي بالك' }

scenes:
  - id: hook
    at: l1
    glow: '{{accent}}'
    camera: push-in
    elements:
      - use: label
        id: org
        props: { text: '{{org}}', dot: true, align: center }
        place: { x: 140, y: 160, w: 800, h: 60 }
        enter: { at: "l1:'طلبت'", anim: wipe }
      - use: counter
        id: hours
        props:
          from: 0
          keyframes: [{ at: "l1:'استلمه'", value: {{hours}}, dur: 1 }]
          suffix: ' h'
          label: 'من الطلب للاستلام'
          color: '{{accent}}'
        place: { x: 140, y: 240, w: 800, h: 320 }
        enter: { at: "l1:'أونلاين'", anim: pop }
      - use: icon
        id: cart
        props: { name: cart, color: '{{accent}}', ring: true }
        place: { x: 460, y: 640, w: 160, h: 160 }
        enter: { at: "l1:'استلمه'+0.4", anim: pop }

  - id: app
    at: l2
    transition: push
    elements:
      - use: phone
        id: phone
        props:
          title: 'الدفع'
          item: 'طلبك'
          button: 'استلام من الفرع'
          taps: [{ at: "l2:'collect'" }]
          notifications:
            - { title: '{{org}}', text: 'شنطتك جاهزة', at: "l3:'جاهزة'", icon: bell }
        place: { x: 480, y: 60, w: 440, h: 860 }
        enter: { at: "l2:'الدفع'", anim: rise }
      - use: chip
        id: pick
        props: { text: 'اختار الفرع', icon: globe, color: '{{accent}}', size: 32 }
        place: { x: 60, y: 200, w: 380, h: 96 }
        enter: { at: "l2:'الفرع'", anim: pop }
      - use: chip
        id: text
        props: { text: 'رسالة لما تجهز', icon: bell, color: '{{accent}}', size: 32 }
        place: { x: 60, y: 340, w: 380, h: 96 }
        enter: { at: "l3:'رسالة'", anim: pop }

  - id: pickup
    at: l4
    transition: zoom
    elements:
      - use: chip
        id: store
        props: { text: '{{store}}', icon: globe, color: '{{accent}}', size: 36 }
        place: { x: 190, y: 120, w: 700, h: 100 }
        enter: { at: "l4:'للكاونتر'", anim: pop }
      - use: title
        id: code
        props: { text: 'ورّي **الكود**', size: 116, accent: '{{accent}}' }
        place: { x: 60, y: 250, w: 960, h: 280 }
        enter: { at: "l4:'الكود'", anim: reveal }
      - use: chip
        id: check
        props: { text: 'راجع المنتجات وخلصت', icon: check, color: '{{accent}}', size: 36 }
        place: { x: 160, y: 600, w: 760, h: 100 }
        enter: { at: "l5:'راجع'", anim: spring }

  - id: busy
    at: l6
    glow: amber
    transition: push
    elements:
      - use: title
        id: busy_title
        props: { text: 'يوم زحمة؟ **استنى رسالتنا**', size: 92, accent: '{{accent}}' }
        place: { x: 60, y: 190, w: 960, h: 330 }
        enter: { at: "l6:'تتغير'", anim: reveal }
      - use: icon
        id: bell
        props: { name: bell, color: '{{accent}}', ring: true, pulse: true }
        place: { x: 460, y: 580, w: 160, h: 160 }
        enter: { at: "l6:'رسالتنا'", anim: pop }

  - id: outro
    at: l7
    transition: slide-up
    elements:
      - use: cta
        id: next
        props:
          label: 'قريبًا'
          prompt: 'اكتب في الكومنتات'
          next: 'الاسترجاع ببساطة'
          keyword: '{{keyword}}'
          color: '{{accent}}'
          at: "l7:'وتابعنا'"
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l7:'اكتب'", anim: rise }
