# Retail · loyalty program, Arabic (template; slots are filled by `reelforge new --pack retail`).
meta:
  id: '{{id}}'
  series: 'الأعضاء'
  title: '{{program}}'
  episode: 1
  preset: tiktok
  theme: retail
  lang: ar-EG
  publish:
    cover: 'إزاي بيشتغل {{program}}'
    caption: 'إزاي بيشتغل {{program}} في {{org}}: اجمع نقاط، وصّل لـ {{reward}} واكسب {{perk}}. الاشتراك مجاني وتقدر تخرج في أي وقت.'
    hashtags: ['#مكافآت', '#تسوق', '#نقاط', '#retail']
    pinned: 'اكتب {{keyword}} ونبعتلك لينك الاشتراك.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'بتشتري من {{org}}؟ تعالى نشوف إزاي بيشتغل {{program}}.'
  - text: 'كل عملية شراء بتجمع نقاط، {{points}} عن كل وحدة بتصرفها.'
  - text: 'نقاطك بتتجمع على الكارت أو في الـ app.'
  - text: 'وصّل لـ {{reward}} نقطة، وتكسب {{perk}}.'
  - text: 'والأعضاء كمان بيدخلوا التخفيضات الموسمية بدري.'
  - text: 'الاشتراك مجاني، وتقدر تخرج في أي وقت.'
  - text: 'اكتب {{keyword}} ونبعتلك لينك الاشتراك.'

chapters:
  - { at: l1, label: '01 · البرنامج' }
  - { at: l2, label: '02 · النقاط' }
  - { at: l5, label: '03 · المزايا' }

scenes:
  - id: hook
    at: l1
    glow: '{{accent}}'
    camera: push-in
    elements:
      - use: label
        id: org
        props: { text: '{{org}}', dot: true, align: center }
        place: { x: 140, y: 170, w: 800, h: 60 }
        enter: { at: "l1:'بتشتري'", anim: wipe }
      - use: title
        id: program
        props: { text: '**{{program}}**', size: 104, accent: '{{accent}}' }
        place: { x: 60, y: 240, w: 960, h: 340 }
        enter: { at: 'l1+1.2', anim: reveal }
      - use: icon
        id: card
        props: { name: card, color: '{{accent}}', ring: true }
        place: { x: 460, y: 640, w: 160, h: 160 }
        enter: { at: "l1:'نشوف'", anim: pop }

  - id: points
    at: l2
    transition: push
    elements:
      - use: stat-card
        id: per_unit
        props: { label: 'نقاط لكل وحدة', value: {{points}}, icon: card, accent: '{{accent}}' }
        place: { x: 580, y: 120, w: 440, h: 300 }
        enter: { at: "l2:'عملية'", anim: rise }
      - use: progress-ring
        id: ring
        props:
          value: 100
          from: 0
          keyframes: [{ at: "l3:'بتتجمع'", value: 60, dur: 1.2 }, { at: "l4:'وتكسب'", value: 100, dur: 0.8 }]
          label: 'لحد المكافأة'
          color: '{{accent}}'
        place: { x: 100, y: 80, w: 380, h: 380 }
        enter: { at: "l3:'بتتجمع'", anim: pop }
      - use: chip
        id: reward
        props: { text: '{{reward}} نقطة = {{perk}}', icon: check, color: '{{accent}}', size: 30, variant: solid }
        place: { x: 60, y: 560, w: 860, h: 104 }
        enter: { at: "l4:'وتكسب'", anim: spring }

  - id: perks
    at: l5
    transition: zoom
    elements:
      - use: chip
        id: early
        props: { text: 'تخفيضات بدري', icon: bolt, color: '{{accent}}', size: 38 }
        place: { x: 190, y: 160, w: 700, h: 104 }
        enter: { at: "l5:'التخفيضات'", anim: pop }
      - use: title
        id: free
        props: { text: 'الاشتراك **مجاني**', size: 110, accent: '{{accent}}' }
        place: { x: 60, y: 310, w: 960, h: 280 }
        enter: { at: "l6:'الاشتراك'", anim: reveal }
      - use: chip
        id: leave
        props: { text: 'اخرج في أي وقت', icon: unlock, color: dim, size: 34 }
        place: { x: 240, y: 640, w: 600, h: 96 }
        enter: { at: "l6:'تخرج'", anim: pop }

  - id: outro
    at: l7
    transition: slide-up
    elements:
      - use: cta
        id: next
        props:
          label: 'اشترك دلوقتي'
          prompt: 'اكتب في الكومنتات'
          next: '{{program}}'
          keyword: '{{keyword}}'
          color: '{{accent}}'
          at: "l7:'ونبعتلك'"
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l7:'اكتب'", anim: rise }
