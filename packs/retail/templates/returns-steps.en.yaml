# Retail · returns in 3 steps (template; slots are filled by `reelforge new --pack retail`).
meta:
  id: '{{id}}'
  series: 'STORE SERVICES'
  title: 'Returns in 3 steps'
  episode: 1
  preset: tiktok
  theme: retail
  lang: en-US
  publish:
    cover: 'Returns in 3 steps'
    caption: 'How to return an item to {{org}}: start online, pack it with its tags, drop it off. You have {{days}} days from delivery; some items cannot be returned, so check the policy.'
    hashtags: ['#returns', '#shopping', '#retail', '#customerservice']
    pinned: 'Comment {{keyword}} for help with your return.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'Changed your mind? Returning an item to {{org}} takes three steps.'
  - text: 'You have {{days}} days from delivery to start a return.'
  - text: 'First, start the return in the app or on the website.'
  - text: 'Next, pack the item with its tags, and print the label.'
  - text: 'Then drop it off at any store or pickup point.'
  - text: 'Your refund goes back to the original payment method.'
  - text: 'Some items cannot be returned, so check the policy. Comment {{keyword}} for help.'

chapters:
  - { at: l1, label: '01 · THE WINDOW' }
  - { at: l3, label: '02 · THREE STEPS' }
  - { at: l6, label: '03 · YOUR REFUND' }

scenes:
  - id: hook
    at: l1
    glow: '{{accent}}'
    camera: push-in
    elements:
      - use: label
        id: org
        props: { text: '{{org}}', dot: true, align: center }
        place: { x: 140, y: 170, w: 800, h: 60 }
        enter: { at: "l1:'Changed'", anim: wipe }
      - use: title
        id: hook_title
        props: { text: 'Returns in **3 steps**', size: 112, accent: '{{accent}}' }
        place: { x: 60, y: 250, w: 960, h: 300 }
        enter: { at: "l1:'Returning'", anim: reveal }
      - use: icon
        id: hook_icon
        props: { name: refresh, color: '{{accent}}', ring: true }
        place: { x: 460, y: 640, w: 160, h: 160 }
        enter: { at: "l1:'three'", anim: pop }

  - id: window
    at: l2
    transition: zoom
    elements:
      - use: counter
        id: days
        props:
          from: 0
          keyframes: [{ at: "l2:'You'", value: {{days}}, dur: 1 }]
          suffix: ' days'
          label: 'FROM DELIVERY'
          color: '{{accent}}'
        place: { x: 140, y: 200, w: 800, h: 320 }
        enter: { at: "l2:'You'", anim: pop }

  - id: steps
    at: l3
    transition: push
    elements:
      - use: steps
        id: return_steps
        props:
          color: '{{accent}}'
          fontSize: 52
          items:
            - { title: 'Start online', text: 'In the app or on the website', at: "l3:'start'" }
            - { title: 'Pack it', text: 'With tags and the label', at: "l4:'pack'" }
            - { title: 'Drop it off', text: 'Any store or pickup point', at: "l5:'drop'" }
        place: { x: 160, y: 40, w: 760, h: 600 }
        enter: { at: "l3:'First'", anim: fade }
      - use: icon
        id: icon_app
        props: { name: phone, color: '{{accent}}', ring: true }
        place: { x: 460, y: 700, w: 160, h: 160 }
        enter: { at: "l3:'app'", anim: pop }
        exit: { at: l4, anim: fade }
      - use: icon
        id: icon_pack
        props: { name: check, color: '{{accent}}', ring: true }
        place: { x: 460, y: 700, w: 160, h: 160 }
        enter: { at: "l4:'label'", anim: pop }
        exit: { at: l5, anim: fade }
      - use: icon
        id: icon_drop
        props: { name: globe, color: '{{accent}}', ring: true }
        place: { x: 460, y: 700, w: 160, h: 160 }
        enter: { at: "l5:'pickup'", anim: pop }

  - id: refund
    at: l6
    transition: zoom
    elements:
      - use: title
        id: refund_title
        props: { text: 'Refund to your **original payment**', size: 96, accent: '{{accent}}' }
        place: { x: 60, y: 180, w: 960, h: 300 }
        enter: { at: "l6:'refund'", anim: reveal }
      - use: icon
        id: card
        props: { name: card, color: '{{accent}}', ring: true }
        place: { x: 460, y: 560, w: 160, h: 160 }
        enter: { at: "l6:'original'", anim: pop }

  - id: outro
    at: l7
    transition: slide-up
    elements:
      - use: chip
        id: policy
        props: { text: 'Check the return policy', icon: warn, color: dim, size: 30 }
        place: { x: 160, y: 60, w: 760, h: 90 }
        enter: { at: "l7:'policy'", anim: pop }
      - use: cta
        id: next
        props:
          label: 'NEED HELP?'
          next: '{{next}}'
          keyword: '{{keyword}}'
          color: '{{accent}}'
          at: "l7:'help'"
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l7:'Comment'", anim: rise }
