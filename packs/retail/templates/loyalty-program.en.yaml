# Retail · loyalty program (template; slots are filled by `reelforge new --pack retail`).
meta:
  id: '{{id}}'
  series: 'MEMBERS'
  title: '{{program}}'
  episode: 1
  preset: tiktok
  theme: retail
  lang: en-US
  publish:
    cover: 'How {{program}} works'
    caption: 'How {{program}} at {{org}} works: earn points, reach {{reward}} and unlock {{perk}}. Free to join, leave any time.'
    hashtags: ['#loyalty', '#rewards', '#shopping', '#retail']
    pinned: 'Comment {{keyword}} and we will send you the sign-up link.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'Do you shop at {{org}}? Here is how {{program}} works.'
  - text: 'Every purchase earns points, {{points}} for each unit you spend.'
  - text: 'Your points build up on your card or in the app.'
  - text: 'Reach {{reward}} points, and you unlock {{perk}}.'
  - text: 'Members also get early access to our seasonal sales.'
  - text: 'Joining is free, and you can leave at any time.'
  - text: 'Comment {{keyword}} and we will send you the sign-up link.'

chapters:
  - { at: l1, label: '01 · THE PROGRAM' }
  - { at: l2, label: '02 · POINTS' }
  - { at: l5, label: '03 · PERKS' }

scenes:
  - id: hook
    at: l1
    glow: '{{accent}}'
    camera: push-in
    elements:
      - use: label
        id: org
        props: { text: '{{org}}', dot: true, align: center }
        place: { x: 140, y: 170, w: 800, h: 60 }
        enter: { at: "l1:'shop'", anim: wipe }
      - use: title
        id: program
        props: { text: '**{{program}}**', size: 108, accent: '{{accent}}' }
        place: { x: 60, y: 250, w: 960, h: 300 }
        enter: { at: 'l1+1.2', anim: reveal }
      - use: icon
        id: card
        props: { name: card, color: '{{accent}}', ring: true }
        place: { x: 460, y: 640, w: 160, h: 160 }
        enter: { at: "l1:'works'", anim: pop }

  - id: points
    at: l2
    transition: push
    elements:
      - use: stat-card
        id: per_unit
        props: { label: 'Points per unit', value: {{points}}, icon: card, accent: '{{accent}}' }
        place: { x: 60, y: 120, w: 440, h: 300 }
        enter: { at: "l2:'Every'", anim: rise }
      - use: progress-ring
        id: ring
        props:
          value: 100
          from: 0
          keyframes: [{ at: "l3:'build'", value: 60, dur: 1.2 }, { at: "l4:'unlock'", value: 100, dur: 0.8 }]
          label: 'To your reward'
          color: '{{accent}}'
        place: { x: 600, y: 80, w: 380, h: 380 }
        enter: { at: "l3:'build'", anim: pop }
      - use: chip
        id: reward
        props: { text: '{{reward}} points = {{perk}}', icon: check, color: '{{accent}}', size: 30, variant: solid }
        place: { x: 60, y: 560, w: 860, h: 104 }
        enter: { at: "l4:'unlock'", anim: spring }

  - id: perks
    at: l5
    transition: zoom
    elements:
      - use: chip
        id: early
        props: { text: 'Early access to sales', icon: bolt, color: '{{accent}}', size: 38 }
        place: { x: 190, y: 160, w: 700, h: 104 }
        enter: { at: "l5:'early'", anim: pop }
      - use: title
        id: free
        props: { text: '**Free** to join', size: 116, accent: '{{accent}}' }
        place: { x: 60, y: 320, w: 960, h: 260 }
        enter: { at: "l6:'Joining'", anim: reveal }
      - use: chip
        id: leave
        props: { text: 'Leave any time', icon: unlock, color: dim, size: 34 }
        place: { x: 240, y: 640, w: 600, h: 96 }
        enter: { at: "l6:'leave'", anim: pop }

  - id: outro
    at: l7
    transition: slide-up
    elements:
      - use: cta
        id: next
        props:
          label: 'JOIN NOW'
          next: '{{program}}'
          keyword: '{{keyword}}'
          color: '{{accent}}'
          at: "l7:'send'"
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l7:'Comment'", anim: rise }
