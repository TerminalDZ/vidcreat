meta:
  id: 'bluebell-pickup-en'
  series: 'STORE SERVICES'
  title: 'Click and collect'
  episode: 1
  preset: tiktok
  theme: retail
  lang: en-US
  publish:
    cover: 'Order online, pick up today'
    caption: 'How click and collect works at Bluebell Market: order online, wait for our text, show the code at Main Street store. Times can vary on busy days.'
    hashtags: ['#clickandcollect', '#shopping', '#retail', '#storepickup']
    pinned: 'Comment RETURNS for our returns guide.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'Ordered online at Bluebell Market? Pick it up in about 2 hours.'
  - text: 'At checkout, choose click and collect, then pick your store.'
  - text: 'We send you a text as soon as your bag is ready.'
  - text: 'Come to the counter at Main Street store and show your code.'
  - text: 'Check your items right there, and you are done in a minute.'
  - text: 'Times can vary on busy days, so wait for our text before you come.'
  - text: 'Comment RETURNS and follow for our returns guide.'

chapters:
  - { at: l1, label: '01 · THE PROMISE' }
  - { at: l2, label: '02 · HOW IT WORKS' }
  - { at: l6, label: '03 · GOOD TO KNOW' }

scenes:
  - id: hook
    at: l1
    glow: 'lime'
    camera: push-in
    elements:
      - use: label
        id: org
        props: { text: 'Bluebell Market', dot: true, align: center }
        place: { x: 140, y: 160, w: 800, h: 60 }
        enter: { at: "l1:'Ordered'", anim: wipe }
      - use: counter
        id: hours
        props:
          from: 0
          keyframes: [{ at: "l1:'Pick'", value: 2, dur: 1 }]
          suffix: ' h'
          label: 'ORDER TO PICKUP'
          color: 'lime'
        place: { x: 140, y: 240, w: 800, h: 320 }
        enter: { at: "l1:'online'", anim: pop }
      - use: icon
        id: cart
        props: { name: cart, color: 'lime', ring: true }
        place: { x: 460, y: 640, w: 160, h: 160 }
        enter: { at: "l1:'Pick'+0.4", anim: pop }

  - id: app
    at: l2
    transition: push
    elements:
      - use: phone
        id: phone
        props:
          title: 'Checkout'
          item: 'Your order'
          button: 'Click & collect'
          taps: [{ at: "l2:'collect'" }]
          notifications:
            - { title: 'Bluebell Market', text: 'Your bag is ready', at: "l3:'ready'", icon: bell }
        place: { x: 60, y: 60, w: 440, h: 860 }
        enter: { at: "l2:'checkout'", anim: rise }
      - use: chip
        id: pick
        props: { text: 'Pick your store', icon: globe, color: 'lime', size: 32 }
        place: { x: 540, y: 200, w: 460, h: 96 }
        enter: { at: "l2:'store'", anim: pop }
      - use: chip
        id: text
        props: { text: 'Text when ready', icon: bell, color: 'lime', size: 32 }
        place: { x: 540, y: 340, w: 460, h: 96 }
        enter: { at: "l3:'text'", anim: pop }

  - id: pickup
    at: l4
    transition: zoom
    elements:
      - use: chip
        id: store
        props: { text: 'Main Street store', icon: globe, color: 'lime', size: 36 }
        place: { x: 190, y: 120, w: 700, h: 100 }
        enter: { at: "l4:'counter'", anim: pop }
      - use: title
        id: code
        props: { text: 'Show your **code**', size: 116, accent: 'lime' }
        place: { x: 60, y: 260, w: 960, h: 260 }
        enter: { at: "l4:'code'", anim: reveal }
      - use: chip
        id: check
        props: { text: 'Check your items, done', icon: check, color: 'lime', size: 36 }
        place: { x: 160, y: 600, w: 760, h: 100 }
        enter: { at: "l5:'Check'", anim: spring }

  - id: busy
    at: l6
    glow: amber
    transition: push
    elements:
      - use: title
        id: busy_title
        props: { text: 'Busy day? **Wait for our text**', size: 96, accent: 'lime' }
        place: { x: 60, y: 200, w: 960, h: 300 }
        enter: { at: "l6:'vary'", anim: reveal }
      - use: icon
        id: bell
        props: { name: bell, color: 'lime', ring: true, pulse: true }
        place: { x: 460, y: 580, w: 160, h: 160 }
        enter: { at: "l6:'text'", anim: pop }

  - id: outro
    at: l7
    transition: slide-up
    elements:
      - use: cta
        id: next
        props:
          label: 'COMING UP'
          next: 'Returns made simple'
          keyword: 'RETURNS'
          color: 'lime'
          at: "l7:'follow'"
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l7:'Comment'", anim: rise }
