# Events & NGOs · where donations go (template; slots are filled by `reelforge new --pack events-ngo`).
meta:
  id: '{{id}}'
  series: 'OUR IMPACT'
  title: 'Where donations go'
  episode: 1
  preset: tiktok
  theme: editorial
  lang: en-US
  publish:
    cover: 'Where your donation goes'
    caption: 'Where every donation to {{org}} goes, from our own yearly report: {{cause}}, transport and storage, and volunteer training.'
    hashtags: ['#nonprofit', '#charity', '#transparency', '#community']
    pinned: 'Comment {{keyword}} to join our next food drive.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'Where does every donation to {{org}} go? Here is the full picture.'
  - text: 'These shares come straight from our own yearly report.'
  - text: 'Most of it, {{meals}} percent, funds {{cause}}.'
  - text: 'Then {{transport}} percent pays for transport and storage.'
  - text: 'And {{training}} percent keeps our volunteers trained and safe.'
  - text: 'Every gift helps, and giving your time helps too.'
  - text: 'Comment {{keyword}} to join our next food drive.'

chapters:
  - { at: l1, label: '01 · THE QUESTION' }
  - { at: l3, label: '02 · THE SHARES' }
  - { at: l6, label: '03 · JOIN US' }

scenes:
  - id: hook
    at: l1
    glow: '{{accent}}'
    camera: push-in
    elements:
      - use: label
        id: org
        props: { text: '{{org}}', dot: true, align: center }
        place: { x: 140, y: 140, w: 800, h: 60 }
        enter: { at: "l1:'Where'", anim: wipe }
      - use: title
        id: hook_title
        props: { text: 'Where your **donation** goes', size: 104, accent: '{{accent}}' }
        place: { x: 60, y: 220, w: 960, h: 320 }
        enter: { at: "l1:'donation'", anim: reveal }
      - use: chip
        id: report
        props: { text: 'From our yearly report', icon: db, color: dim, size: 34 }
        place: { x: 190, y: 620, w: 700, h: 100 }
        enter: { at: "l2:'report'", anim: fade }

  - id: shares
    at: l3
    transition: push
    elements:
      - use: donut-chart
        id: donut
        props:
          color: '{{accent}}'
          label: 'Every donation'
          segments:
            - { label: 'Programs', value: {{meals}}, color: '{{accent}}' }
            - { label: 'Transport', value: {{transport}}, color: cyan }
            - { label: 'Volunteers', value: {{training}}, color: amber }
        place: { x: 60, y: 20, w: 960, h: 520 }
        enter: { at: "l3:'Most'", anim: fade }
      - use: chip
        id: cause
        props: { text: '{{cause}}', icon: users, color: '{{accent}}', size: 32 }
        place: { x: 160, y: 580, w: 760, h: 96 }
        enter: { at: "l3:'funds'", anim: pop }
      - use: chip
        id: transport
        props: { text: 'Transport and storage', icon: queue, color: cyan, size: 32 }
        place: { x: 160, y: 700, w: 760, h: 96 }
        enter: { at: "l4:'storage'", anim: pop }
      - use: chip
        id: training
        props: { text: 'Trained, safe volunteers', icon: shield, color: amber, size: 32 }
        place: { x: 160, y: 820, w: 760, h: 96 }
        enter: { at: "l5:'volunteers'", anim: pop }

  - id: helps
    at: l6
    transition: zoom
    elements:
      - use: title
        id: helps_title
        props: { text: 'Every gift **helps**', size: 116, accent: '{{accent}}' }
        place: { x: 60, y: 200, w: 960, h: 280 }
        enter: { at: "l6:'gift'", anim: reveal }
      - use: chip
        id: time
        props: { text: 'Your time helps too', icon: clock, color: '{{accent}}', size: 38 }
        place: { x: 190, y: 560, w: 700, h: 104 }
        enter: { at: "l6:'time'", anim: spring }

  - id: outro
    at: l7
    transition: slide-up
    elements:
      - use: cta
        id: next
        props:
          label: 'JOIN US'
          next: 'Our next food drive'
          keyword: '{{keyword}}'
          color: '{{accent}}'
          at: "l7:'join'"
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l7:'Comment'", anim: rise }
