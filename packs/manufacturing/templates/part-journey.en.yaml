# Manufacturing · how a part is made (template; slots are filled by `reelforge new --pack manufacturing`).
meta:
  id: '{{id}}'
  series: 'ON THE LINE'
  title: 'How a {{part}} is made'
  episode: 1
  preset: tiktok
  theme: industrial
  lang: en-US
  publish:
    cover: 'Raw material to box'
    caption: 'How a {{part}} is made at {{plant}}: cut, bend, weld, inspect and pack, in about {{minutes}} minutes per part.'
    hashtags: ['#manufacturing', '#factory', '#howitsmade', '#engineering']
    pinned: 'Comment {{keyword}} for part two: what quality control looks for.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'How does a {{part}} get made at {{plant}}? Follow one from start to box.'
  - text: 'It starts as {{material}}, cut to size by the laser.'
  - text: 'Next, the press bends it into shape in a few seconds.'
  - text: 'Then a welding robot joins the parts, and an operator checks every seam.'
  - text: 'Quality control measures each piece before it moves on to packing.'
  - text: 'From start to box, it takes about {{minutes}} minutes per part.'
  - text: 'Comment {{keyword}} for part two: what quality control looks for.'

chapters:
  - { at: l1, label: '01 · THE PART' }
  - { at: l2, label: '02 · THE LINE' }
  - { at: l6, label: '03 · CYCLE TIME' }

scenes:
  - id: hook
    at: l1
    glow: '{{accent}}'
    camera: push-in
    elements:
      - use: label
        id: plant
        props: { text: '{{plant}}', dot: true, align: center }
        place: { x: 140, y: 170, w: 800, h: 60 }
        enter: { at: "l1:'How'", anim: wipe }
      - use: title
        id: part
        props: { text: '**{{part}}**', size: 104, accent: '{{accent}}' }
        place: { x: 60, y: 250, w: 960, h: 300 }
        enter: { at: 'l1+0.6', anim: reveal }
      - use: chip
        id: box
        props: { text: 'Raw material to box', icon: cpu, color: '{{accent}}', size: 38 }
        place: { x: 190, y: 640, w: 700, h: 104 }
        enter: { at: "l1:'Follow'", anim: spring }

  - id: line
    at: l2
    transition: push
    elements:
      - use: flow
        id: stages
        props:
          color: cyan
          accent: '{{accent}}'
          fontSize: 26
          token: { at: "l2:'cut'", dur: 12, color: '{{accent}}' }
          stages:
            - { label: 'Cut', icon: bolt, at: "l2:'laser'" }
            - { label: 'Bend', icon: refresh, at: "l3:'press'" }
            - { label: 'Weld', icon: fire, at: "l4:'welding'" }
            - { label: 'Inspect', icon: check, at: "l5:'Quality'" }
            - { label: 'Pack', icon: queue, at: "l5:'packing'" }
        place: { x: 60, y: 80, w: 960, h: 300 }
        enter: { at: "l2:'starts'", anim: fade }
      - use: chip
        id: press
        props: { text: 'Bent in seconds', icon: refresh, color: '{{accent}}', size: 32 }
        place: { x: 160, y: 440, w: 760, h: 96 }
        enter: { at: "l3:'shape'", anim: pop }
      - use: chip
        id: seam
        props: { text: 'Every seam checked', icon: users, color: '{{accent}}', size: 32 }
        place: { x: 160, y: 570, w: 760, h: 96 }
        enter: { at: "l4:'operator'", anim: pop }
      - use: chip
        id: measured
        props: { text: 'Each piece measured', icon: check, color: lime, size: 32 }
        place: { x: 160, y: 700, w: 760, h: 96 }
        enter: { at: "l5:'measures'", anim: pop }

  - id: cycle
    at: l6
    transition: zoom
    elements:
      - use: counter
        id: minutes
        props:
          from: 0
          keyframes: [{ at: "l6:'about'", value: {{minutes}}, dur: 1 }]
          suffix: ' min'
          label: 'PER PART, START TO BOX'
          color: '{{accent}}'
        place: { x: 140, y: 180, w: 800, h: 320 }
        enter: { at: "l6:'start'", anim: pop }

  - id: outro
    at: l7
    transition: slide-up
    elements:
      - use: cta
        id: next
        props:
          label: 'PART TWO'
          next: 'What quality control looks for'
          keyword: '{{keyword}}'
          color: '{{accent}}'
          at: "l7:'part'"
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l7:'Comment'", anim: rise }
