# Healthcare · patient journey (template; slots are filled by `reelforge new --pack healthcare`).
meta:
  id: '{{id}}'
  series: 'PATIENT GUIDE'
  title: 'Your first visit'
  episode: 1
  preset: tiktok
  theme: clinical
  lang: en-US
  publish:
    cover: 'Your first visit, step by step'
    caption: 'What happens at your first visit to {{org}}, from check-in to your doctor. General information, not medical advice: ask your care team about your own situation.'
    hashtags: ['#patientguide', '#hospital', '#healthcare', '#firstvisit']
    pinned: 'Comment {{keyword}} for part two: {{next}}.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'First visit at {{org}}? Here is what happens, step by step.'
  - text: 'At {{desk}}, please bring your ID, your insurance card and your referral letter.'
  - text: 'Check-in usually takes about {{wait}} minutes, so try to arrive a little early.'
  - text: 'Next, a nurse checks your vital signs and asks a few short questions.'
  - text: 'Then you meet your doctor in a private room to talk everything through.'
  - text: 'Before you leave, the front desk books any follow-up visit you need.'
  - text: 'Questions about symptoms or results? Always talk to your doctor or care team.'
  - text: 'Comment {{keyword}} and follow for part two: {{next}}.'

chapters:
  - { at: l1, label: '01 · CHECK-IN' }
  - { at: l4, label: '02 · YOUR CARE' }
  - { at: l7, label: '03 · QUESTIONS' }

scenes:
  - id: hook
    at: l1
    glow: '{{accent}}'
    camera: push-in
    elements:
      - use: label
        id: org
        props: { text: '{{org}}', dot: true, align: center }
        place: { x: 140, y: 170, w: 800, h: 60 }
        enter: { at: "l1:'First'", anim: wipe }
      - use: title
        id: hook_title
        props: { text: 'Your **first visit**, step by step', size: 104, accent: '{{accent}}' }
        place: { x: 60, y: 250, w: 960, h: 330 }
        enter: { at: "l1:'visit'", anim: reveal }
      - use: icon
        id: hook_icon
        props: { name: user, color: '{{accent}}', ring: true }
        place: { x: 460, y: 640, w: 160, h: 160 }
        enter: { at: "l1:'happens'", anim: pop }

  - id: bring
    at: l2
    transition: push
    elements:
      - use: label
        id: bring_label
        props: { text: 'At check-in, bring', dot: true }
        place: { x: 100, y: 170, w: 820, h: 60 }
        enter: { at: 'l2+0.2', anim: wipe }
      - use: checklist
        id: bring_list
        props:
          color: '{{accent}}'
          fontSize: 60
          items:
            - { text: 'Photo ID', at: "l2:'ID'" }
            - { text: 'Insurance card', at: "l2:'insurance'" }
            - { text: 'Referral letter', at: "l2:'referral'" }
        place: { x: 100, y: 270, w: 820, h: 440 }
        enter: { at: "l2:'bring'", anim: rise }

  - id: wait
    at: l3
    transition: zoom
    elements:
      - use: counter
        id: wait_count
        props:
          from: 0
          keyframes: [{ at: "l3:'about'", value: {{wait}}, dur: 1 }]
          suffix: ' min'
          label: 'TYPICAL CHECK-IN'
          color: '{{accent}}'
        place: { x: 140, y: 180, w: 800, h: 320 }
        enter: { at: "l3:'Check-in'", anim: pop }
      - use: chip
        id: early
        props: { text: 'Arrive a little early', icon: clock, color: '{{accent}}', size: 40 }
        place: { x: 190, y: 600, w: 700, h: 110 }
        enter: { at: "l3:'arrive'", anim: spring }

  - id: care
    at: l4
    transition: push
    camera: drift
    elements:
      - use: steps
        id: care_steps
        props:
          color: '{{accent}}'
          fontSize: 54
          items:
            - { title: 'Vital signs', text: 'A nurse checks them', icon: user, at: "l4:'nurse'" }
            - { title: 'Your doctor', text: 'Time to talk it through', icon: users, at: "l5:'doctor'" }
            - { title: 'Follow-up', text: 'Only if you need one', icon: clock, at: "l6:'books'" }
        place: { x: 160, y: 40, w: 760, h: 600 }
        enter: { at: "l4:'Next'", anim: fade }
      - use: chip
        id: private
        props: { text: 'Private room', icon: lock, color: '{{accent}}', size: 34 }
        place: { x: 60, y: 690, w: 410, h: 96 }
        enter: { at: "l5:'private'", anim: pop }
      - use: chip
        id: desk
        props: { text: 'Booked for you', icon: check, color: '{{accent}}', size: 34 }
        place: { x: 510, y: 690, w: 410, h: 96 }
        enter: { at: "l6:'leave'", anim: pop }

  - id: ask
    at: l7
    glow: lime
    transition: zoom
    elements:
      - use: title
        id: ask_title
        props: { text: 'Ask your **care team**', size: 116, accent: '{{accent}}' }
        place: { x: 60, y: 220, w: 960, h: 300 }
        enter: { at: "l7:'Questions'", anim: reveal }
      - use: chip
        id: disclaimer
        props: { text: 'General information, not medical advice', icon: shield, color: dim, size: 30 }
        place: { x: 60, y: 580, w: 860, h: 96 }
        enter: { at: "l7:'Always'", anim: pop }

  - id: outro
    at: l8
    transition: slide-up
    elements:
      - use: cta
        id: next
        props:
          label: 'PART TWO'
          next: '{{next}}'
          keyword: '{{keyword}}'
          color: '{{accent}}'
          at: "l8:'follow'"
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l8:'Comment'", anim: rise }
