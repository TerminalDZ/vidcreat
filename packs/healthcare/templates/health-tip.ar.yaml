# Healthcare · health awareness tip, Arabic (template; slots are filled by `reelforge new --pack healthcare`).
meta:
  id: '{{id}}'
  series: 'نصائح صحية'
  title: '{{topic}}'
  episode: {{num}}
  preset: tiktok
  theme: clinical
  lang: ar-EG
  publish:
    cover: '{{topic}}: 3 تذكيرات سهلة'
    caption: 'ثلاث تذكيرات سهلة عن {{topic}} من فريق {{org}}. توعية عامة وليست نصيحة طبية: تحدث مع طبيبك عن صحتك.'
    hashtags: ['#نصائح_صحية', '#صحة', '#توعية']
    pinned: 'احفظ النصيحة، وتحدث مع طبيبك عما يناسبك.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'عادة صغيرة يمكن أن تصنع فرقًا حقيقيًا. موضوعنا اليوم: {{topic}}.'
  - text: 'هذه توعية عامة من فريق {{org}}، وليست تشخيصًا.'
  - text: 'التذكير الأول سهل جدًا: {{tip1}}.'
  - text: 'والتذكير الثاني بنفس البساطة: {{tip2}}.'
  - text: 'والثالث، وهو الذي ننساه كثيرًا: {{tip3}}.'
  - text: 'كل شخص مختلف، وما يناسبك قد يختلف عما يناسب غيرك.'
  - text: 'عندك أسئلة عن صحتك؟ تحدث مع طبيبك أو فريق الرعاية.'
  - text: 'احفظ هذه النصيحة، وتابعنا للنصيحة القادمة.'

chapters:
  - { at: l1, label: '01 · العادة' }
  - { at: l3, label: '02 · التذكيرات' }
  - { at: l6, label: '03 · صحتك' }

scenes:
  - id: hook
    at: l1
    glow: '{{accent}}'
    camera: push-in
    elements:
      - use: label
        id: kicker
        props: { text: 'نصيحة صحية رقم {{num}}', dot: true, align: center }
        place: { x: 140, y: 130, w: 800, h: 60 }
        enter: { at: "l1:'عادة'", anim: wipe }
      - use: icon
        id: hook_icon
        props: { name: check, color: '{{accent}}', ring: true }
        place: { x: 460, y: 220, w: 160, h: 160 }
        enter: { at: "l1:'فرقًا'", anim: pop }
      - use: title
        id: topic
        props: { text: '**{{topic}}**', size: 90, accent: '{{accent}}' }
        place: { x: 60, y: 400, w: 960, h: 220 }
        enter: { at: "l1:'اليوم'", anim: reveal }
      - use: chip
        id: aware
        props: { text: 'توعية عامة وليست تشخيصًا', icon: shield, color: dim, size: 30 }
        place: { x: 60, y: 740, w: 860, h: 96 }
        enter: { at: "l2:'توعية'", anim: fade }

  - id: tips
    at: l3
    transition: push
    elements:
      - use: node
        id: tip1
        props: { title: '{{tip1}}', sub: 'التذكير 1', icon: check, color: '{{accent}}', status: ok }
        place: { x: 60, y: 60, w: 860, h: 200 }
        enter: { at: "l3:'الأول'", anim: slide-l }
      - use: node
        id: tip2
        props: { title: '{{tip2}}', sub: 'التذكير 2', icon: check, color: '{{accent}}', status: ok }
        place: { x: 60, y: 300, w: 860, h: 200 }
        enter: { at: "l4:'الثاني'", anim: slide-l }
      - use: node
        id: tip3
        props: { title: '{{tip3}}', sub: 'التذكير 3', icon: check, color: '{{accent}}', status: ok }
        place: { x: 60, y: 540, w: 860, h: 200 }
        enter: { at: "l5:'والثالث'", anim: slide-l }

  - id: different
    at: l6
    transition: zoom
    camera: drift
    elements:
      - use: title
        id: different_title
        props: { text: 'كل شخص **مختلف**', size: 112, accent: '{{accent}}' }
        place: { x: 60, y: 220, w: 960, h: 300 }
        enter: { at: "l6:'شخص'", anim: reveal }
      - use: icon
        id: users
        props: { name: users, color: '{{accent}}', ring: true }
        place: { x: 460, y: 600, w: 160, h: 160 }
        enter: { at: "l6:'يناسبك'", anim: pop }

  - id: ask
    at: l7
    glow: lime
    transition: push
    elements:
      - use: title
        id: ask_title
        props: { text: 'تحدث مع **طبيبك**', size: 116, accent: '{{accent}}' }
        place: { x: 60, y: 220, w: 960, h: 300 }
        enter: { at: "l7:'أسئلة'", anim: reveal }
      - use: chip
        id: disclaimer
        props: { text: 'معلومات عامة وليست نصيحة طبية', icon: shield, color: dim, size: 30 }
        place: { x: 60, y: 580, w: 860, h: 96 }
        enter: { at: "l7:'تحدث'", anim: pop }

  - id: outro
    at: l8
    transition: slide-up
    elements:
      - use: cta
        id: next
        props: { label: 'احفظ النصيحة', next: 'نصيحة جديدة قريبًا', color: '{{accent}}' }
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l8:'احفظ'", anim: rise }
