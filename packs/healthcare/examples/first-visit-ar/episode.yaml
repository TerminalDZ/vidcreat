      - use: chip
        id: desk
        props: { text: 'موعد محجوز لك', icon: check, color: 'cyan', size: 34 }
        place: { x: 60, y: 690, w: 410, h: 96 }
        enter: { at: "l6:'تغادر'", anim: pop }

  - id: ask
    at: l7
    glow: lime
    transition: zoom
    elements:
      - use: title
        id: ask_title
        props: { text: 'اسأل **فريق الرعاية**', size: 116, accent: 'cyan' }
        place: { x: 60, y: 220, w: 960, h: 300 }
        enter: { at: "l7:'أسئلة'", anim: reveal }
      - use: chip
        id: disclaimer
        props: { text: 'معلومات عامة وليست نصيحة طبية', icon: shield, color: dim, size: 30 }
        place: { x: 60, y: 580, w: 860, h: 96 }
        enter: { at: "l7:'دائمًا'", anim: pop }

  - id: outro
    at: l8
    transition: slide-up
    elements:
      - use: cta
        id: next
        props:
          label: 'الجزء الثاني'
          prompt: 'اكتب في التعليقات'
