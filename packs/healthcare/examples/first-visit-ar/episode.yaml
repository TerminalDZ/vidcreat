script:
  - text: 'أول زيارة لك في مستشفى نورثويند؟ هذا ما يحدث خطوة بخطوة.'
  - text: 'في مكتب الاستقبال، أحضر بطاقة الهوية وبطاقة التأمين وخطاب التحويل.'
  - text: 'تسجيل الوصول يستغرق عادةً حوالي 10 دقيقة، فاحضر مبكرًا قليلًا.'
  - text: 'بعدها تقيس الممرضة العلامات الحيوية وتسألك بعض الأسئلة القصيرة.'
  - text: 'ثم تقابل طبيبك في غرفة خاصة لتتحدثا عن كل التفاصيل.'
  - text: 'وقبل أن تغادر، يحجز لك الاستقبال أي موعد متابعة تحتاجه.'
  - text: 'عندك أسئلة عن الأعراض أو النتائج؟ تحدث دائمًا مع طبيبك أو فريق الرعاية.'
  - text: 'اكتب زيارة في التعليقات، وتابعنا للجزء الثاني: التحضير لتحليل الدم.'

chapters:
  - { at: l1, label: '01 · الاستقبال' }
  - { at: l4, label: '02 · رعايتك' }
  - { at: l7, label: '03 · أسئلتك' }

scenes:
  - id: hook
    at: l1
    glow: 'cyan'
    camera: push-in
    elements:
