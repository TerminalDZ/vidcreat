      - use: title
        id: hook_title
        props: { text: 'زيارتك **الأولى** خطوة بخطوة', size: 104, accent: 'cyan' }
        place: { x: 60, y: 250, w: 960, h: 330 }
        enter: { at: "l1:'زيارة'", anim: reveal }
      - use: icon
        id: hook_icon
        props: { name: user, color: 'cyan', ring: true }
        place: { x: 460, y: 640, w: 160, h: 160 }
        enter: { at: "l1:'يحدث'", anim: pop }

  - id: bring
    at: l2
    transition: push
    elements:
      - use: label
        id: bring_label
        props: { text: 'أحضر معك', dot: true }
        place: { x: 100, y: 170, w: 820, h: 60 }
        enter: { at: 'l2+0.2', anim: wipe }
      - use: checklist
        id: bring_list
        props:
          color: 'cyan'
          fontSize: 60
          items:
            - { text: 'بطاقة الهوية', at: "l2:'الهوية'" }
            - { text: 'بطاقة التأمين', at: "l2:'التأمين'" }
            - { text: 'خطاب التحويل', at: "l2:'التحويل'" }
        place: { x: 100, y: 270, w: 820, h: 440 }
        enter: { at: "l2:'أحضر'", anim: rise }

  - id: wait
    at: l3
    transition: zoom
    elements:
      - use: counter
        id: wait_count
        props:
          from: 0
          keyframes: [{ at: "l3:'حوالي'", value: 10, dur: 1 }]
