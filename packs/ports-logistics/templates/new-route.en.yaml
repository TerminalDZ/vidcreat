# Ports · new route (template; slots are filled by `reelforge new --pack ports-logistics`).
meta:
  id: '{{id}}'
  series: 'NEW SERVICE'
  title: '{{org}} to {{dest}}'
  episode: 1
  preset: tiktok
  theme: harbor
  lang: en-US
  publish:
    cover: 'New direct route: {{dest}}'
    caption: 'A new direct service from {{org}} to {{dest}}, run by {{carrier}}. Schedules can change; customs rules differ by country, so check with a licensed broker.'
    hashtags: ['#shipping', '#logistics', '#newroute', '#freight']
    pinned: 'Comment {{keyword}} for the full schedule.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'New route alert: {{org}} now connects directly to {{dest}}.'
  - text: 'The service is run by {{carrier}}, with {{calls}} sailings every week.'
  - text: 'Transit time is about {{days}} days, from quay to quay.'
  - text: 'That means fewer transshipments, and fewer chances for delays.'
  - text: 'The first sailing is planned for {{starts}}, and schedules can still change.'
  - text: 'Customs rules differ by country, so check with a licensed broker.'
  - text: 'Comment {{keyword}} and we will send you the full schedule.'

chapters:
  - { at: l1, label: '01 · THE ROUTE' }
  - { at: l2, label: '02 · THE SERVICE' }
  - { at: l5, label: '03 · FIRST SAILING' }

scenes:
  - id: hook
    at: l1
    glow: '{{accent}}'
    elements:
      - use: label
        id: kicker
        props: { text: 'New route', dot: true, color: '{{accent}}' }
        place: { x: 60, y: 60, w: 640, h: 60 }
        enter: { at: "l1:'New'", anim: wipe }
      - use: node
        id: origin
        props: { title: '{{org}}', sub: 'Origin', icon: globe, color: cyan }
        place: { x: 60, y: 160, w: 500, h: 170 }
        enter: { at: "l1:'route'", anim: pop }
      - use: node
        id: dest
        props: { title: '{{dest}}', sub: 'Destination', icon: globe, color: '{{accent}}' }
        place: { x: 520, y: 420, w: 500, h: 170 }
        enter: { at: "l1:'connects'", anim: pop }
      - use: arrow
        id: lane
        props:
          from: origin.bottom
          to: dest.left
          route: elbow
          color: '{{accent}}'
          packet: { at: "l1:'directly'", dur: 1.6, color: '{{accent}}' }
        enter: { at: "l1:'connects'+0.2", anim: draw }

  - id: service
    at: l2
    transition: push
    elements:
      - use: label
        id: carrier
        props: { text: '{{carrier}}', dot: true, align: center }
        place: { x: 140, y: 170, w: 800, h: 60 }
        enter: { at: "l2:'service'", anim: wipe }
      - use: stat-card
        id: calls
        props: { label: 'Sailings per week', value: {{calls}}, icon: refresh, accent: '{{accent}}' }
        place: { x: 270, y: 280, w: 540, h: 300 }
        enter: { at: "l2:'sailings'", anim: rise }

  - id: transit
    at: l3
    transition: zoom
    elements:
      - use: counter
        id: days
        props:
          from: 0
          keyframes: [{ at: "l3:'about'", value: {{days}}, dur: 1 }]
          suffix: ' days'
          label: 'TRANSIT · QUAY TO QUAY'
          color: '{{accent}}'
        place: { x: 140, y: 120, w: 800, h: 320 }
        enter: { at: "l3:'Transit'", anim: pop }
      - use: before-after
        id: direct
        props:
          before: { label: 'Before', text: 'Via a hub port' }
          after: { label: 'Now', text: 'Direct' }
          at: "l4:'fewer'"
          fontSize: 40
        place: { x: 60, y: 500, w: 860, h: 300 }
        enter: { at: "l4:'means'", anim: rise }

  - id: start
    at: l5
    transition: push
    elements:
      - use: label
        id: first
        props: { text: 'First sailing', dot: true, align: center }
        place: { x: 140, y: 100, w: 800, h: 60 }
        enter: { at: "l5:'first'", anim: wipe }
      - use: title
        id: date
        props: { text: '**{{starts}}**', size: 110, accent: '{{accent}}' }
        place: { x: 60, y: 180, w: 960, h: 240 }
        enter: { at: "l5:'planned'", anim: reveal }
      - use: chip
        id: change
        props: { text: 'Schedules can change', icon: refresh, color: dim, size: 34 }
        place: { x: 160, y: 470, w: 760, h: 100 }
        enter: { at: "l5:'schedules'", anim: pop }
      - use: chip
        id: broker
        props: { text: 'Customs: ask a licensed broker', icon: shield, color: dim, size: 34 }
        place: { x: 60, y: 630, w: 860, h: 100 }
        enter: { at: "l6:'Customs'", anim: pop }

  - id: outro
    at: l7
    transition: slide-up
    elements:
      - use: cta
        id: next
        props:
          label: 'FULL SCHEDULE'
          next: '{{org}} to {{dest}}'
          keyword: '{{keyword}}'
          color: '{{accent}}'
          at: "l7:'send'"
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l7:'Comment'", anim: rise }
