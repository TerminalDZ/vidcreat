# Ports · container journey, Arabic (template; slots are filled by `reelforge new --pack ports-logistics`).
meta:
  id: '{{id}}'
  series: 'أساسيات الموانئ'
  title: 'رحلة الحاوية'
  episode: 1
  preset: tiktok
  theme: harbor
  lang: ar-EG
  publish:
    cover: 'من السفينة للبوابة في 4 مراحل'
    caption: 'إزاي الـ container بيتحرك جوه {{org}}: الرصيف والساحة والـ customs والبوابة. المدد أمثلة، وقواعد الجمارك بتختلف من بلد لبلد، فاسأل الـ forwarder أو مخلص جمركي مرخص.'
    hashtags: ['#لوجستيات', '#شحن', '#موانئ', '#logistics']
    pinned: 'اكتب {{keyword}} للجزء التاني: {{next}}.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'إزاي الـ container بيوصل من السفينة لمخزنك في {{org}}؟'
  - text: 'الأول، الـ crane بيرفعه من السفينة وينزله على الرصيف.'
  - text: 'بعدها بيستنى في الساحة لحد ما الـ customs تخلّص الأوراق.'
  - text: 'وبعدين يتحجز للشاحنة موعد، والبوابة تسجل خروجه.'
  - text: 'من السفينة للبوابة، الرحلة دي بتاخد حوالي {{days}} أيام كمثال.'
  - text: 'الأوراق الناقصة هي أكبر سبب للتأخير، فابعتها قبل ما السفينة توصل.'
  - text: 'اكتب {{keyword}} للجزء التاني: {{next}}.'

chapters:
  - { at: l1, label: '01 · السؤال' }
  - { at: l2, label: '02 · المراحل' }
  - { at: l6, label: '03 · التأخير' }

scenes:
  - id: hook
    at: l1
    glow: '{{accent}}'
    camera: push-in
    elements:
      - use: label
        id: org
        props: { text: '{{org}}', dot: true, align: center }
        place: { x: 140, y: 170, w: 800, h: 60 }
        enter: { at: "l1:'إزاي'", anim: wipe }
      - use: title
        id: hook_title
        props: { text: 'من السفينة **لمخزنك**', size: 96, accent: '{{accent}}' }
        place: { x: 60, y: 240, w: 960, h: 360 }
        enter: { at: "l1:'container'", anim: reveal }
      - use: icon
        id: hook_icon
        props: { name: queue, color: '{{accent}}', ring: true }
        place: { x: 460, y: 640, w: 160, h: 160 }
        enter: { at: "l1:'لمخزنك'", anim: pop }

  - id: journey
    at: l2
    transition: push
    elements:
      - use: flow
        id: stages
        props:
          color: cyan
          accent: '{{accent}}'
          fontSize: 30
          token: { at: "l2:'بيرفعه'", dur: 9, color: '{{accent}}' }
          stages:
            - { label: 'الرصيف', sub: 'الرافعة', icon: queue, at: "l2:'الرصيف'" }
            - { label: 'الساحة', sub: 'انتظار', icon: hourglass, at: "l3:'الساحة'" }
            - { label: 'الجمارك', sub: 'الأوراق', icon: shield, at: "l3:'customs'" }
            - { label: 'البوابة', sub: 'خروج', icon: check, at: "l4:'والبوابة'" }
        place: { x: 60, y: 120, w: 960, h: 320 }
        enter: { at: "l2:'crane'", anim: fade }
      - use: chip
        id: clears
        props: { text: 'الجمارك تخلّص الأوراق', icon: shield, color: '{{accent}}', size: 34 }
        place: { x: 160, y: 520, w: 760, h: 100 }
        enter: { at: "l3:'تخلّص'", anim: spring }
      - use: chip
        id: slot
        props: { text: 'موعد الشاحنة اتحجز', icon: clock, color: '{{accent}}', size: 34 }
        place: { x: 160, y: 660, w: 760, h: 100 }
        enter: { at: "l4:'للشاحنة'", anim: spring }

  - id: time
    at: l5
    transition: zoom
    elements:
      - use: counter
        id: days
        props:
          from: 0
          keyframes: [{ at: "l5:'حوالي'", value: {{days}}, dur: 1 }]
          suffix: ' أيام'
          label: 'من السفينة للبوابة · مثال'
          color: '{{accent}}'
        place: { x: 140, y: 200, w: 800, h: 320 }
        enter: { at: "l5:'السفينة'", anim: pop }

  - id: delay
    at: l6
    glow: red
    transition: cut
    elements:
      - use: chip
        id: missing
        props: { text: 'الأوراق الناقصة', icon: warn, color: red, size: 46 }
        place: { x: 160, y: 180, w: 760, h: 120 }
        enter: { at: "l6:'الأوراق'", anim: pop }
        fx: [{ at: "l6:'للتأخير'", do: shake, amp: 10 }]
      - use: title
        id: early
        props: { text: 'ابعتها **قبل الوصول**', size: 96, accent: '{{accent}}' }
        place: { x: 60, y: 380, w: 960, h: 240 }
        enter: { at: "l6:'فابعتها'", anim: reveal }

  - id: outro
    at: l7
    transition: slide-up
    elements:
      - use: cta
        id: next
        props:
          label: 'الجزء التاني'
          prompt: 'اكتب في الكومنتات'
          next: '{{next}}'
          keyword: '{{keyword}}'
          color: '{{accent}}'
          at: "l7:'للجزء'"
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l7:'اكتب'", anim: rise }
