# Education · study plan (template; slots are filled by `reelforge new --pack education`).
meta:
  id: '{{id}}'
  series: 'STUDY SMART'
  title: 'A calm study plan'
  episode: 1
  preset: tiktok
  theme: campus
  lang: en-US
  publish:
    cover: '{{days}} days left? Try this plan'
    caption: 'A calm study plan for the last {{days}} days before {{exam}}: hardest topics first, short sessions and spaced review.'
    hashtags: ['#studytips', '#exams', '#studytok', '#education']
    pinned: 'Comment {{keyword}} for a printable checklist.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'Only {{days}} days until {{exam}}? Here is a calm plan you can follow.'
  - text: 'First, list every topic and mark the ones you find hardest.'
  - text: 'Study the hard topics in the morning, while your mind is fresh.'
  - text: 'Keep your sessions to about {{hours}} hours a day, with short breaks.'
  - text: 'Review each topic after one day, then three days, then seven.'
  - text: 'And on the night before the exam, rest instead of cramming.'
  - text: 'Save this plan, and comment {{keyword}} for a printable checklist.'

chapters:
  - { at: l1, label: '01 · THE PLAN' }
  - { at: l2, label: '02 · EVERY DAY' }
  - { at: l5, label: '03 · REVIEW' }

scenes:
  - id: hook
    at: l1
    glow: '{{accent}}'
    camera: push-in
    elements:
      - use: counter
        id: days
        props:
          from: 0
          keyframes: [{ at: "l1:'Only'+0.2", value: {{days}}, dur: 1 }]
          suffix: ' days'
          label: 'UNTIL THE EXAM'
          color: '{{accent}}'
        place: { x: 140, y: 100, w: 800, h: 320 }
        enter: { at: "l1:'Only'", anim: pop }
      - use: title
        id: plan
        props: { text: 'A **calm** study plan', size: 92, accent: '{{accent}}' }
        place: { x: 60, y: 470, w: 860, h: 240 }
        enter: { at: "l1:'calm'", anim: reveal }

  - id: daily
    at: l2
    transition: push
    elements:
      - use: node
        id: list
        props: { title: 'List every topic', sub: 'Mark the hardest ones', icon: check, color: '{{accent}}' }
        place: { x: 60, y: 60, w: 860, h: 190 }
        enter: { at: "l2:'list'", anim: slide-r }
      - use: node
        id: morning
        props: { title: 'Hard topics first', sub: 'In the morning', icon: bolt, color: '{{accent}}' }
        place: { x: 60, y: 290, w: 860, h: 190 }
        enter: { at: "l3:'hard'", anim: slide-r }
      - use: node
        id: hours
        props: { title: '{{hours}} hours a day', sub: 'With short breaks', icon: hourglass, color: '{{accent}}' }
        place: { x: 60, y: 520, w: 860, h: 190 }
        enter: { at: "l4:'sessions'", anim: slide-r }

  - id: review
    at: l5
    transition: zoom
    elements:
      - use: label
        id: review_label
        props: { text: 'Spaced review', dot: true, align: center }
        place: { x: 140, y: 170, w: 800, h: 60 }
        enter: { at: "l5:'Review'", anim: wipe }
      - use: timeline
        id: spaced
        props:
          color: '{{accent}}'
          start: 'Study'
          end: 'Exam'
          markers:
            - { pos: 0.15, label: 'Day 1', at: "l5:'one'" }
            - { pos: 0.45, label: 'Day 3', at: "l5:'three'" }
            - { pos: 0.9, label: 'Day 7', at: "l5:'seven'" }
        place: { x: 60, y: 280, w: 960, h: 280 }
        enter: { at: "l5:'Review'+0.2", anim: wipe }

  - id: rest
    at: l6
    glow: violet
    transition: push
    camera: drift
    elements:
      - use: chip
        id: night
        props: { text: 'The night before', icon: clock, color: violet, size: 38 }
        place: { x: 190, y: 160, w: 700, h: 104 }
        enter: { at: "l6:'night'", anim: pop }
      - use: title
        id: rest_title
        props: { text: '**Rest**, do not cram', size: 110, accent: '{{accent}}' }
        place: { x: 60, y: 320, w: 960, h: 280 }
        enter: { at: "l6:'rest'", anim: reveal }

  - id: outro
    at: l7
    transition: slide-up
    elements:
      - use: cta
        id: next
        props:
          label: 'SAVE THIS PLAN'
          next: 'Printable checklist'
          keyword: '{{keyword}}'
          color: '{{accent}}'
          at: "l7:'comment'"
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l7:'Save'", anim: rise }
