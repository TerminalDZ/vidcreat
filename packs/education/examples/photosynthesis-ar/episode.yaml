  - text: 'في حصة الأحياء في أكاديمية ويستفيلد، نقسمه إلى ثلاثة أجزاء بسيطة.'
  - text: 'الجزء الأول، وهو نقطة البداية: ضوء الشمس.'
  - text: 'الجزء الثاني، وهو ما يجعل العملية تستمر: الماء.'
  - text: 'الجزء الثالث، وهو ما ينساه كثيرون: ثاني أكسيد الكربون.'
  - text: 'اجمع الأجزاء معًا، فتكون النتيجة: سكر وأكسجين.'
  - text: 'احفظ الفيديو للمراجعة، واكتب التالي للموضوع التالي.'

chapters:
