# Government · program deadlines, Arabic (template; slots are filled by `reelforge new --pack government`).
meta:
  id: '{{id}}'
  series: 'البرامج العامة'
  title: '{{program}}'
  episode: 1
  preset: tiktok
  theme: civic
  lang: ar-EG
  publish:
    cover: '{{program}}: 3 تواريخ'
    caption: 'التواريخ المهمة لـ {{program}} من {{city}}: يبدأ التقديم {{open}}، وينتهي {{close}}، والقرارات في {{result}}. شروط الأهلية على الصفحة الرسمية.'
    hashtags: ['#خدمات_حكومية', '#مواعيد', '#دليل']
    pinned: 'اكتب {{keyword}} وسنذكّرك قبل آخر موعد.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'تنوي التقديم على {{program}}؟ سجّل هذه التواريخ الثلاثة.'
  - text: 'يبدأ التقديم في {{open}}، على موقع {{city}}.'
  - text: 'آخر يوم للتقديم هو {{close}}، ولا تُقبل الطلبات المتأخرة.'
  - text: 'تُرسل القرارات بالبريد الإلكتروني في {{result}}.'
  - text: 'جهّز مستنداتك مبكرًا حتى لا تتعجل في النهاية.'
  - text: 'شروط الأهلية موجودة على الصفحة الرسمية، فراجعها لحالتك.'
  - text: 'اكتب {{keyword}} وسنذكّرك قبل آخر موعد.'

chapters:
  - { at: l1, label: '01 · البرنامج' }
  - { at: l2, label: '02 · ثلاثة تواريخ' }
  - { at: l5, label: '03 · استعد' }

scenes:
  - id: hook
    at: l1
    glow: '{{accent}}'
    elements:
      - use: label
        id: city
        props: { text: '{{city}}', dot: true, align: center }
        place: { x: 140, y: 170, w: 800, h: 60 }
        enter: { at: "l1:'تنوي'", anim: wipe }
      - use: title
        id: program
        props: { text: '**{{program}}**', size: 96, accent: '{{accent}}' }
        place: { x: 60, y: 240, w: 960, h: 340 }
        enter: { at: 'l1+0.6', anim: reveal }
      - use: chip
        id: three
        props: { text: '3 تواريخ مهمة', icon: clock, color: '{{accent}}', size: 38 }
        place: { x: 240, y: 640, w: 600, h: 104 }
        enter: { at: "l1:'التواريخ'", anim: pop }

  - id: dates
    at: l2
    transition: push
    elements:
      - use: timeline
        id: dates_line
        props:
          color: '{{accent}}'
          markers:
            - { pos: 0.15, label: '{{open}}', sub: 'البداية', at: "l2:'يبدأ'" }
            - { pos: 0.5, label: '{{close}}', sub: 'آخر يوم', at: "l3:'آخر'", color: amber }
            - { pos: 0.85, label: '{{result}}', sub: 'القرارات', at: "l4:'القرارات'" }
        place: { x: 60, y: 120, w: 960, h: 280 }
        enter: { at: "l2:'يبدأ'", anim: wipe }
      - use: chip
        id: late
        props: { text: 'لا تُقبل الطلبات المتأخرة', icon: warn, color: amber, size: 34 }
        place: { x: 160, y: 480, w: 760, h: 100 }
        enter: { at: "l3:'المتأخرة'", anim: pop }
      - use: chip
        id: email
        props: { text: 'القرار بالبريد الإلكتروني', icon: mail, color: '{{accent}}', size: 34 }
        place: { x: 160, y: 620, w: 760, h: 100 }
        enter: { at: "l4:'بالبريد'", anim: pop }

  - id: ready
    at: l5
    transition: zoom
    elements:
      - use: title
        id: early
        props: { text: 'جهّز **مبكرًا**', size: 116, accent: '{{accent}}' }
        place: { x: 60, y: 160, w: 960, h: 300 }
        enter: { at: "l5:'جهّز'", anim: reveal }
      - use: chip
        id: eligibility
        props: { text: 'الأهلية: راجع الصفحة الرسمية', icon: globe, color: '{{accent}}', size: 32 }
        place: { x: 60, y: 560, w: 860, h: 100 }
        enter: { at: "l6:'الأهلية'", anim: pop }

  - id: outro
    at: l7
    transition: slide-up
    elements:
      - use: cta
        id: next
        props:
          label: 'تذكير'
          prompt: 'اكتب في التعليقات'
          next: 'قبل {{close}}'
          keyword: '{{keyword}}'
          color: '{{accent}}'
          at: "l7:'وسنذكّرك'"
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l7:'اكتب'", anim: rise }
