# Government · renew a document online, Arabic (template; slots are filled by `reelforge new --pack government`).
meta:
  id: '{{id}}'
  series: 'الخدمات العامة'
  title: 'التجديد أونلاين'
  episode: 1
  preset: tiktok
  theme: civic
  lang: ar-EG
  publish:
    cover: 'جدّد {{doc}} أونلاين'
    caption: 'كيف تجدد {{doc}} أونلاين مع {{city}} في ثلاث خطوات. القواعد والرسوم قد تختلف حسب حالتك: راجع الموقع الرسمي.'
    hashtags: ['#خدمات_حكومية', '#خطوات', '#دليل']
    pinned: 'اكتب {{keyword}} لدليل حجز المواعيد.'

audio: { voice: voice.wav, sfx: auto, sfx_gain_db: -16 }

script:
  - text: 'تريد تجديد {{doc}}؟ يمكنك فعل ذلك أونلاين في ثلاث خطوات.'
  - text: 'أولًا، سجّل الدخول إلى بوابة {{city}} بحسابك.'
  - text: 'ثم ارفع صورة حديثة ونسخة ممسوحة من بطاقتك الحالية.'
  - text: 'ادفع الرسوم أونلاين، واحتفظ برقم الإيصال.'
  - text: 'تستغرق المعالجة عادةً حوالي {{days}} أيام عمل، ويمكنك متابعتها أونلاين.'
  - text: 'القواعد والرسوم قد تختلف حسب حالتك، فراجع الموقع الرسمي.'
  - text: 'اكتب {{keyword}} لدليلنا عن حجز موعد.'

chapters:
  - { at: l1, label: '01 · أونلاين' }
  - { at: l2, label: '02 · ثلاث خطوات' }
  - { at: l5, label: '03 · بعد التقديم' }

scenes:
  - id: hook
    at: l1
    glow: '{{accent}}'
    elements:
      - use: label
        id: city
        props: { text: '{{city}}', dot: true, align: center }
        place: { x: 140, y: 170, w: 800, h: 60 }
        enter: { at: "l1:'تريد'", anim: wipe }
      - use: title
        id: hook_title
        props: { text: 'جدّد **{{doc}}**', size: 100, accent: '{{accent}}' }
        place: { x: 60, y: 240, w: 960, h: 340 }
        enter: { at: 'l1+0.6', anim: reveal }
      - use: chip
        id: three
        props: { text: 'أونلاين في 3 خطوات', icon: globe, color: '{{accent}}', size: 38 }
        place: { x: 190, y: 640, w: 700, h: 104 }
        enter: { at: "l1:'أونلاين'", anim: pop }

  - id: steps
    at: l2
    transition: push
    elements:
      - use: steps
        id: renew_steps
        props:
          color: '{{accent}}'
          fontSize: 52
          items:
            - { title: 'تسجيل الدخول', text: 'بوابة المدينة', at: "l2:'سجّل'" }
            - { title: 'رفع المستندات', text: 'صورة والبطاقة الحالية', at: "l3:'ارفع'" }
            - { title: 'دفع الرسوم', text: 'احتفظ برقم الإيصال', at: "l4:'ادفع'" }
        place: { x: 160, y: 40, w: 760, h: 600 }
        enter: { at: "l2:'أولًا'", anim: fade }
      - use: icon
        id: icon_sign
        props: { name: user, color: '{{accent}}', ring: true }
        place: { x: 460, y: 700, w: 160, h: 160 }
        enter: { at: "l2:'بحسابك'", anim: pop }
        exit: { at: l3, anim: fade }
      - use: icon
        id: icon_upload
        props: { name: cloud, color: '{{accent}}', ring: true }
        place: { x: 460, y: 700, w: 160, h: 160 }
        enter: { at: "l3:'صورة'", anim: pop }
        exit: { at: l4, anim: fade }
      - use: icon
        id: icon_pay
        props: { name: card, color: '{{accent}}', ring: true }
        place: { x: 460, y: 700, w: 160, h: 160 }
        enter: { at: "l4:'الإيصال'", anim: pop }

  - id: processing
    at: l5
    transition: zoom
    elements:
      - use: counter
        id: days
        props:
          from: 0
          keyframes: [{ at: "l5:'حوالي'", value: {{days}}, dur: 1 }]
          suffix: ' أيام'
          label: 'مدة المعالجة · أيام عمل'
          color: '{{accent}}'
        place: { x: 140, y: 160, w: 800, h: 320 }
        enter: { at: "l5:'المعالجة'", anim: pop }
      - use: chip
        id: track
        props: { text: 'تابع طلبك أونلاين', icon: refresh, color: '{{accent}}', size: 38 }
        place: { x: 240, y: 580, w: 600, h: 104 }
        enter: { at: "l5:'متابعتها'", anim: pop }

  - id: rules
    at: l6
    transition: push
    elements:
      - use: title
        id: official
        props: { text: 'راجع **الموقع الرسمي**', size: 100, accent: '{{accent}}' }
        place: { x: 60, y: 190, w: 960, h: 320 }
        enter: { at: "l6:'القواعد'", anim: reveal }
      - use: icon
        id: globe
        props: { name: globe, color: '{{accent}}', ring: true }
        place: { x: 460, y: 580, w: 160, h: 160 }
        enter: { at: "l6:'الرسمي'", anim: pop }

  - id: outro
    at: l7
    transition: slide-up
    elements:
      - use: cta
        id: next
        props:
          label: 'قريبًا'
          prompt: 'اكتب في التعليقات'
          next: 'حجز موعد'
          keyword: '{{keyword}}'
          color: '{{accent}}'
          at: "l7:'لدليلنا'"
        place: { x: 60, y: 200, w: 860, h: 560 }
        enter: { at: "l7:'اكتب'", anim: rise }
