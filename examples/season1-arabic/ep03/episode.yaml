# Season 1 · Episode 3 — Rate Limiting
meta:
  id: ep03
  series: 'SYSTEM DESIGN'
  title: 'Rate Limiting'
  episode: 3
  preset: tiktok
  theme: season1
  lang: ar-EG
  publish:
    cover: 'script واحد وقّع الـ API'
    caption: |
      ألف request في الثانية من script واحد… والـ API وقع.
      الحل اسمه Rate Limiting، وأشهر طريقة هي الـ Token Bucket.
      وخلي بالك من فخ الـ counter اللي في الـ memory.
    hashtags: ['#systemdesign', '#ratelimiting', '#tokenbucket', '#redis', '#backend', '#برمجة', '#مبرمجين']
    pinned: 'اكتب cache في الكومنتات عشان الحلقة الجاية عن الـ Caching والـ Cache Stampede 👇'

audio:
  voice: voice.wav
  sfx: auto
  sfx_gain_db: -16

script:
  - text: 'الـ API بتاعك وقع، ومفيش ولا user حقيقي بيستخدمه.'
  - text: 'script واحد بيبعت ألف request في الثانية.'
  - text: 'الـ CPU وصل مية في المية، والـ database اتخنقت.'
  - text: 'والـ users الحقيقيين بقوا يشوفوا timeout.'
  - text: 'الحل اسمه Rate Limiting.'
  - text: 'تحدد كل client يبعت كام request في وقت معين.'
  - text: 'وأشهر algorithm هو الـ Token Bucket.'
  - text: 'تخيل جردل فيه عشر tokens.'
  - text: 'كل request بياخد token واحد ويعدي.'
  - text: 'والجردل بيتملى تاني، token كل مية millisecond.'
  - text: 'لو جت burst، الـ tokens بتخلص بسرعة.'
  - text: 'ولما الجردل يفضى، الـ request يترفض بـ 429.'
  - text: 'يعني Too Many Requests، ومعاه Retry-After.'
  - text: 'الحلو إنه بيسمح بـ burst قصير، ويحمي على المدى الطويل.'
  - text: 'بس خلي بالك، في فخ مشهور هنا.'
  - text: 'إنك تخزن الـ counter في memory كل server.'
  - text: 'عندك خمس servers ورا load balancer؟'
  - text: 'يبقى الـ limit الحقيقي بقى خمس أضعاف.'
  - text: 'الـ counter لازم يكون مشترك، في Redis مثلًا.'
  - text: 'والـ check والـ decrement في خطوة atomic واحدة.'
  - text: 'بـ Lua script، أو INCR مع EXPIRE.'
  - text: 'وحط الـ limit على الـ API key، مش الـ IP بس.'
  - text: 'الحلقة الجاية: إزاي الـ cache نفسه ممكن يموّت الـ database.'
  - text: 'اكتب cache في الكومنتات.'

chapters:
  - { at: l1, label: '01 · THE PROBLEM' }
  - { at: l5, label: '02 · TOKEN BUCKET' }
  - { at: l15, label: '03 · THE TRAP' }
  - { at: l19, label: '04 · PRODUCTION' }

scenes:
  # ── hook: one script takes the API down ─────────────────────────────────
  - id: hook
    at: l1
    glow: red
    elements:
      - use: node
        id: api
        props: { title: 'API', sub: 'api.shop.com', icon: server, color: violet }
        place: { x: 330, y: 30, w: 420, h: 170 }
        enter: { at: "l1:'API'", anim: pop }
        states:
          - { at: "l1:'وقع،'", set: { status: err, sub: '503 · down' } }
        fx:
          - { at: "l1:'وقع،'", do: shake, amp: 18 }
      - use: counter
        id: rps
        props:
          keyframes: [{ at: "l2:'script'", value: 3 }, { at: "l2:'ألف'", value: 1000, dur: 1.0 }]
          label: 'requests / sec · 1 IP'
          size: 140
          color: red
        place: { x: 120, y: 250, w: 840, h: 260 }
        enter: { at: "l2:'script'", anim: rise }
      - use: particles
        id: flood
        props: { kind: herd, count: 90, dur: 2.0, color: red, at: "l2:'request'", to: { x: 540, y: 115 } }
      - use: meter
        id: cpu
        props:
          label: 'CPU'
          unit: '%'
          keyframes: [{ at: "l3:'CPU'", value: 35 }, { at: "l3:'مية'", value: 100, dur: 0.8 }]
          max: 100
          threshold: 80
        place: { x: 60, y: 570, w: 880, h: 170 }
        enter: { at: "l3:'CPU'", anim: rise }
      - use: chip
        id: db
        props: { text: 'DB: too many connections', color: red, icon: db, size: 30 }
        place: { x: 60, y: 780, w: 560, h: 84 }
        enter: { at: "l3:'database'", anim: pop }
      - use: chip
        id: users
        props: { text: 'users → timeout', color: amber, icon: users, size: 30 }
        place: { x: 60, y: 890, w: 460, h: 84 }
        enter: { at: "l4:'timeout'", anim: pop }

  # ── 02 · the idea ────────────────────────────────────────────────────────
  - id: fix
    at: l5
    glow: lime
    elements:
      - use: title
        id: rl
        props: { text: '**Rate** Limiting', size: 120, sub: 'N requests per window, per client' }
        place: { x: 60, y: 60, w: 960, h: 280 }
        enter: { at: "l5:'Rate'", anim: pop }
      - use: table
        id: plans
        props:
          columns: ['client', 'limit']
          widths: [1, 1]
          fontSize: 32
          rows:
            - { cells: ['free plan', '10 req / s'], at: "l6:'client'" }
            - { cells: ['pro plan', '100 req / s'], at: "l6:'request'" }
            - { cells: ['scraper', { text: '1000 req / s', color: red }], at: "l6:'معين'", strike: 'l7' }
        place: { x: 60, y: 380, w: 880, h: 300 }
        enter: { at: "l6:'client'", anim: rise }
      - use: chip
        id: tb
        props: { text: 'Token Bucket', color: lime, icon: bolt, variant: solid, size: 44 }
        place: { x: 220, y: 760, w: 600, h: 120 }
        enter: { at: "l7:'Token'", anim: pop }

  # ── the bucket ───────────────────────────────────────────────────────────
  - id: bucket
    at: l8
    glow: lime
    elements:
      - use: bucket
        id: bk
        props:
          capacity: 10
          label: 'token bucket'
          rate: '+1 token / 100ms'
          keyframes:
            - { at: "l8:'عشر'", tokens: 10 }
            - { at: "l9:'بياخد'", tokens: 9 }
            - { at: "l10:'بيتملى'", tokens: 10 }
            - { at: "l11:'burst،'", tokens: 6 }
            - { at: "l11:'بتخلص'", tokens: 2 }
            - { at: "l11:'بسرعة'", tokens: 0 }
        place: { x: 40, y: 30, w: 460, h: 580 }
        enter: { at: "l8:'جردل'", anim: rise }
      - use: chip
        id: one
        props: { text: '1 request = 1 token', color: cyan, icon: key, size: 28 }
        place: { x: 560, y: 60, w: 460, h: 84 }
        enter: { at: "l9:'token'", anim: pop }
      - use: chip
        id: refill
        props: { text: 'refill: 10 / sec', color: lime, icon: refresh, size: 28 }
        place: { x: 560, y: 170, w: 460, h: 84 }
        enter: { at: "l10:'millisecond'", anim: pop }
      - use: code
        id: resp
        props:
          title: 'response'
          lang: http
          fontSize: 26
          cps: 60
          numbers: false
          lines:
            - { text: 'HTTP/1.1 429', color: red, at: "l12:'429'" }
            - { text: 'Too Many Requests', at: "l13:'Too'" }
            - { text: 'Retry-After: 1', color: amber, at: "l13:'Retry-After'" }
        place: { x: 560, y: 290, w: 460, h: 230 }
        enter: { at: "l12:'يترفض'", anim: rise }
      - use: stamp
        id: s429
        props: { text: '429', color: red, size: 110 }
        place: { x: 140, y: 230, w: 260, h: 170 }
        enter: { at: "l12:'429'" }
      - use: timeline
        id: shape
        props:
          start: '0s'
          end: '60s'
          color: lime
          markers:
            - { pos: 0.12, label: 'burst ✓', sub: 'up to 10', at: "l14:'burst'", color: amber }
            - { pos: 0.55, label: 'steady 10/s', at: "l14:'ويحمي'", color: lime }
            - { pos: 0.88, label: 'protected', at: "l14:'الطويل'", color: cyan }
        place: { x: 60, y: 680, w: 880, h: 240 }
        enter: { at: "l14:'الحلو'", anim: rise }

  # ── 03 · the trap ────────────────────────────────────────────────────────
  - id: trap
    at: l15
    glow: amber
    elements:
      - use: trap
        id: tr
        props: { sub: 'a counter per server', at: "l15:'فخ'", until: 'l16' }
      - use: node
        id: lb
        props: { title: 'Load Balancer', icon: globe, color: cyan }
        place: { x: 290, y: 30, w: 500, h: 160 }
        enter: { at: "l17:'load'", anim: pop }
      - use: grid
        id: fleet
        props:
          label: "limit = 10/s in each server's memory"
          cols: 5
          rows: 1
          tiles: ['S1', 'S2', 'S3', 'S4', 'S5']
          steps:
            - { at: "l17:'servers'", set: { '0-4': ok } }
            - { at: "l18:'خمس'", set: { '0-4': warn } }
        place: { x: 60, y: 300, w: 960, h: 260 }
        enter: { at: "l16:'memory'", anim: rise }
      - use: arrow
        id: lb_fleet
        props:
          from: lb.bottom
          to: fleet.top
          color: cyan
          packets:
            - { at: "l17:'balancer؟'", dur: 0.6 }
            - { at: "l17:'balancer؟'+0.3", dur: 0.6 }
        enter: { at: "l17:'balancer؟'", anim: draw }
      - use: counter
        id: real
        props:
          keyframes: [{ at: "l18:'limit'", value: 10 }, { at: "l18:'أضعاف'", value: 50, dur: 0.8 }]
          suffix: ' / s'
          label: 'real limit'
          color: amber
          size: 150
        place: { x: 120, y: 620, w: 800, h: 300 }
        enter: { at: "l18:'limit'", anim: rise }
        fx:
          - { at: "l18:'أضعاف'", do: pulse, color: amber }

  # ── 04 · production ──────────────────────────────────────────────────────
  - id: shared
    at: l19
    glow: violet
    elements:
      - use: node
        id: s1
        props: { title: 'S1', icon: server, color: cyan }
        place: { x: 60, y: 30, w: 280, h: 140 }
        enter: { at: "l19:'counter'", anim: pop }
      - use: node
        id: s2
        props: { title: 'S2', icon: server, color: cyan }
        place: { x: 400, y: 30, w: 280, h: 140 }
        enter: { at: "l19:'counter'+0.1", anim: pop }
      - use: node
        id: s3
        props: { title: 'S3', icon: server, color: cyan }
        place: { x: 740, y: 30, w: 280, h: 140 }
        enter: { at: "l19:'counter'+0.2", anim: pop }
      - use: node
        id: redis
        props: { title: 'Redis', sub: 'rate:{api_key}', icon: db, color: red }
        place: { x: 330, y: 300, w: 420, h: 170 }
        enter: { at: "l19:'Redis'", anim: pop }
        states:
          - { at: "l20:'atomic'", set: { status: ok, sub: 'one atomic step' } }
      - use: arrow
        id: a1
        props: { from: s1.bottom, to: redis.left, route: elbow, color: violet, packet: { at: "l20:'check'" } }
        enter: { at: "l19:'Redis'", anim: draw }
      - use: arrow
        id: a2
        props: { from: s2.bottom, to: redis.top, color: violet, packet: { at: "l20:'decrement'" } }
        enter: { at: "l19:'Redis'", anim: draw }
      - use: arrow
        id: a3
        props: { from: s3.bottom, to: redis.right, route: elbow, color: violet, packet: { at: "l20:'خطوة'" } }
        enter: { at: "l19:'Redis'", anim: draw }
      - use: code
        id: lua
        props:
          title: 'redis'
          lang: redis
          fontSize: 30
          cps: 50
          lines:
            - { text: 'n = INCR rate:{key}', at: "l21:'INCR'" }
            - { text: 'if n == 1: EXPIRE rate:{key} 1', at: "l21:'EXPIRE'" }
            - { text: 'if n > 10: return 429', color: red, at: "l21:'EXPIRE'+0.8" }
        place: { x: 40, y: 540, w: 900, h: 250 }
        enter: { at: "l21:'Lua'", anim: rise }
      - use: chip
        id: bykey
        props: { text: 'API key', color: lime, icon: key, variant: solid, size: 32 }
        place: { x: 60, y: 850, w: 360, h: 96 }
        enter: { at: "l22:'API'", anim: pop }
      - use: chip
        id: byip
        props: { text: 'IP only', color: red, icon: globe, strike: "l22:'بس'", variant: outline, size: 32 }
        place: { x: 480, y: 850, w: 360, h: 96 }
        enter: { at: "l22:'IP'", anim: pop }

  # ── CTA ──────────────────────────────────────────────────────────────────
  - id: cta
    at: l23
    glow: lime
    elements:
      - use: cta
        id: next
        props:
          { next: 'Caching & Stampede', keyword: 'cache', prompt: 'اكتب في الكومنتات', at: "l24:'cache'" }
        place: { x: 90, y: 160, w: 850, h: 600 }
        enter: { at: "l23:'الجاية'", anim: rise }
      - use: particles
        id: conf
        props: { kind: confetti, count: 80, at: "l24:'الكومنتات'", colors: [lime, cyan, violet, amber] }
