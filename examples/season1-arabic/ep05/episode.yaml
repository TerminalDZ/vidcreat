# Season 1 · Episode 5 — Retries & Exponential Backoff
meta:
  id: ep05
  series: 'SYSTEM DESIGN'
  title: 'Retries & Exponential Backoff'
  episode: 5
  preset: tiktok
  theme: season1
  lang: ar-EG
  publish:
    cover: 'الـ retry بتاعك هو اللي وقّع السيرفر'
    caption: |
      الـ server وقع خمس ثواني... والـ clients بتوعك خلّوها ساعة.
      الحلقة دي عن الـ Retry Storm وإزاي تعمل retry صح:
      Exponential Backoff + Jitter + Circuit Breaker + Idempotency
    hashtags:
      ['#systemdesign', '#backend', '#distributedsystems', '#softwareengineering', '#برمجة', '#مبرمجين']
    pinned: 'إنت بتعمل retry إزاي في الكود بتاعك؟ قولنا في الكومنتات 👇'

audio:
  voice: voice.wav
  sfx: auto
  sfx_gain_db: -16

script:
  - text: 'الـ API وقعت خمس ثواني، وبعدها فضلت واقعة ساعة كاملة!'
    break: ['وبعدها']
  - text: 'ليه؟ لأن الـ clients بتوعك هما اللي قتلوها.'
  - text: 'خلينا نبدأ من الأول.'
  - text: 'الـ request فشل بسبب timeout، فبتعمل retry.'
  - text: 'ده طبيعي، الشبكة بتهنّج والـ errors المؤقتة بتحصل.'
    break: ['الشبكة']
  - text: 'بس المشكلة لما تعمل retry على طول من غير ما تستنى.'
    break: ['على']
  - text: 'تخيل عشرة آلاف client، كل واحد بيعمل retry تلات مرات.'
    break: ['كل']
  - text: 'يبقى الـ server بيستقبل تلاتين ألف request وهو تعبان.'
    break: ['تلاتين']
  - text: 'ده اسمه Retry Storm، والـ server عمره ما هيقوم.'
    break: ['والـ']
  - text: 'والفخ إنك تقول: هستنى ثانية ثابتة بين كل retry.'
    break: ['هستنى']
  - text: 'كده كل الـ clients هيرجعوا مع بعض في نفس الثانية.'
    break: ['هيرجعوا']
  - text: 'الحل اسمه Exponential Backoff.'
  - text: 'أول retry بعد ثانية، وبعدين اتنين، وبعدين أربعة، وبعدين تمانية.'
    break: ['وبعدين']
  - text: 'كل مرة بتضاعف وقت الانتظار، فالـ server ياخد نفسه.'
    break: ['فالـ']
  - text: 'بس لسه فيه مشكلة: الكل بيرجع في نفس اللحظات.'
    break: ['الكل']
  - text: 'فبتضيف Jitter، يعني وقت random صغير على كل انتظار.'
    break: ['يعني']
  - text: 'كده الـ retries بتتفرّق بدل ما تيجي موجة واحدة.'
    break: ['بدل']
  - text: 'وحط حد أقصى: max retries و max delay.'
    break: ['max']
  - text: 'ولو الـ server لسه واقع، Circuit Breaker يوقف المحاولات.'
    break: ['Circuit']
  - text: 'وآخر حاجة: الـ retry آمن بس لو الـ request Idempotent.'
    break: ['آمن']
  - text: 'يعني لو اتنفذ مرتين، النتيجة متتغيرش.'
  - text: 'غير كده، الـ retry ممكن يخصم الفلوس مرتين.'
  - text: 'الحلقة الجاية عن الـ Deadlocks، لما اتنين يستنوا بعض للأبد.'
    break: ['لما']
  - text: 'اكتب deadlock في الكومنتات عشان توصلك.'

chapters:
  - { at: l1, label: '01 · THE PROBLEM' }
  - { at: l7, label: '02 · RETRY STORM' }
  - { at: l10, label: '03 · THE TRAP' }
  - { at: l12, label: '04 · THE FIX' }
  - { at: l23, label: '05 · NEXT' }

scenes:
  # ── 01 · hook ──────────────────────────────────────────────────────────────
  - id: hook
    at: l1
    glow: [{ at: l1, color: amber }, { at: "l1:'ساعة'", color: red }]
    elements:
      - use: label
        id: hk_lbl
        props: { text: 'INCIDENT #482 · SEV-1', dot: true, color: red }
        place: { x: 60, y: 20, w: 640, h: 60 }
        enter: { at: l1, anim: fade }
      - use: node
        id: hk_api
        props: { title: 'API', sub: '503 Service Unavailable', icon: server, color: violet, status: err }
        place: { x: 190, y: 110, w: 700, h: 200 }
        enter: { at: "l1:'API'", anim: pop }
        fx:
          - { at: "l1:'وقعت'", do: shake, amp: 18 }
      - use: timeline
        id: hk_outage
        props:
          start: '0'
          end: '1h'
          color: red
          markers:
            - { pos: 0.1, label: '5s', sub: 'blip', color: amber, at: "l1:'خمس'" }
            - { pos: 0.88, label: '1h', sub: 'still down', color: red, at: "l1:'ساعة'" }
          cursor:
            - { at: "l1:'خمس'", pos: 0.1 }
            - { at: "l1:'ساعة'", pos: 0.88, dur: 0.8 }
        place: { x: 60, y: 360, w: 960, h: 240 }
        enter: { at: "l1:'خمس'", anim: rise }
      - use: icon
        id: hk_users
        props: { name: users, size: 120, color: red, ring: true }
        place: { x: 60, y: 690, w: 160, h: 160 }
        enter: { at: "l2:'clients'", anim: pop }
      - use: chip
        id: hk_kill
        props: { text: 'killed by its own clients', color: red, variant: outline, size: 36 }
        place: { x: 250, y: 720, w: 640, h: 100 }
        enter: { at: "l2:'قتلوها.'", anim: stamp }

  # ── basics: why we retry ───────────────────────────────────────────────────
  - id: basics
    at: l3
    glow: cyan
    elements:
      - use: node
        id: bs_client
        props: { title: 'Client', sub: 'checkout', icon: phone }
        place: { x: 40, y: 50, w: 320, h: 170 }
        enter: { at: l3, anim: pop }
      - use: node
        id: bs_server
        props: { title: 'Server', sub: 'POST /order', icon: server, color: violet }
        place: { x: 720, y: 50, w: 320, h: 170 }
        enter: { at: "l3:'الأول.'", anim: pop }
        states:
          - { at: "l4:'timeout،'", set: { status: err, sub: 'timeout' } }
          - { at: "l4:'retry.'", set: { status: busy, sub: 'retrying…' } }
      - use: arrow
        id: bs_req
        props:
          from: bs_client
          to: bs_server
          color: cyan
          label: 'request'
          packets:
            - { at: "l4:'request'", dur: 0.7 }
            - { at: "l4:'retry.'", dur: 0.7, color: amber, label: 'retry' }
        enter: { at: "l4:'request'", anim: draw }
      - use: chip
        id: bs_transient
        props: { text: 'transient errors happen', color: amber, icon: wifi-off, size: 36 }
        place: { x: 140, y: 290, w: 800, h: 100 }
        enter: { at: "l5:'errors'", anim: pop }
      - use: code
        id: bs_code
        props:
          title: 'client.ts'
          lines:
            - 'while (true) {'
            - '  try { return await call(); }'
            - '  catch { /* retry now! */ }'
            - '}'
          highlight: [{ line: 3, at: "l6:'تستنى.'", color: red }]
          cps: 80
          fontSize: 34
        place: { x: 40, y: 440, w: 880, h: 330 }
        enter: { at: "l6:'retry'", anim: rise }

  # ── 02 · the storm ─────────────────────────────────────────────────────────
  - id: storm
    at: l7
    glow: [{ at: l7, color: violet }, { at: l9, color: red }]
    elements:
      - use: counter
        id: st_rps
        props:
          keyframes:
            [{ at: "l7:'عشرة'", value: 10000, dur: 0.8 }, { at: "l8:'تلاتين'", value: 30000, dur: 0.8 }]
          suffix: ' req'
          label: 'hitting the server'
          size: 130
        place: { x: 90, y: 0, w: 900, h: 260 }
        enter: { at: "l7:'عشرة'", anim: pop }
      - use: chip
        id: st_x3
        props: { text: '× 3 retries each', color: amber, icon: refresh, size: 36 }
        place: { x: 240, y: 290, w: 600, h: 96 }
        enter: { at: "l7:'تلات'", anim: pop }
      - use: node
        id: st_server
        props: { title: 'Server', sub: 'recovering…', icon: server, color: violet, status: warn }
        place: { x: 240, y: 440, w: 600, h: 180 }
        enter: { at: "l8:'server'", anim: pop }
        states:
          - { at: "l8:'تعبان.'", set: { status: err, sub: 'overloaded' } }
        fx:
          - { at: "l8:'تعبان.'", do: shake, amp: 22 }
      - use: particles
        id: st_herd
        props:
          {
            kind: herd,
            from: { x: 540, y: 1000 },
            to: st_server.bottom,
            count: 160,
            at: "l8:'request'",
            dur: 1.8,
            color: amber,
            spread: 360,
          }
      - use: stamp
        id: st_stamp
        props: { text: 'RETRY STORM', color: red, size: 88 }
        place: { x: 60, y: 680, w: 860, h: 240 }
        enter: { at: "l9:'Retry'" }

  # ── 03 · the trap: fixed delay ─────────────────────────────────────────────
  - id: trap
    at: l10
    glow: amber
    elements:
      - use: trap
        id: tp_trap
        props: { sub: 'a fixed 1s delay?', at: l10, until: "l10:'هستنى'" }
      - use: title
        id: tp_title
        props: { text: 'Fixed **1s** delay', size: 90, accent: amber }
        place: { x: 40, y: 20, w: 1000, h: 180 }
        enter: { at: "l10:'ثانية'", anim: pop }
      - use: timeline
        id: tp_fixed
        props:
          start: '0s'
          end: '4s'
          color: amber
          markers:
            - { pos: 0.25, label: '1s', sub: '10k', color: red, at: "l10:'retry.'" }
            - { pos: 0.5, label: '2s', sub: '10k', color: red, at: "l11:'clients'" }
            - { pos: 0.75, label: '3s', sub: '10k', color: red, at: "l11:'بعض'" }
        place: { x: 60, y: 250, w: 960, h: 260 }
        enter: { at: "l10:'retry.'", anim: rise }
      - use: chip
        id: tp_wave
        props: { text: 'synchronized waves', color: red, icon: warn, size: 40 }
        place: { x: 140, y: 600, w: 680, h: 110 }
        enter: { at: "l11:'نفس'", anim: stamp }

  # ── 04 · the fix: exponential backoff ──────────────────────────────────────
  - id: backoff
    at: l12
    glow: lime
    elements:
      - use: title
        id: bo_title
        props: { text: 'Exponential **Backoff**', size: 88 }
        place: { x: 40, y: 0, w: 1000, h: 180 }
        enter: { at: "l12:'Exponential'", anim: pop }
      - use: timeline
        id: bo_tl
        props:
          start: '0s'
          end: '16s'
          color: lime
          markers:
            - { pos: 0.0625, label: '1s', at: "l13:'ثانية،'" }
            - { pos: 0.1875, label: '+2s', at: "l13:'اتنين،'" }
            - { pos: 0.4375, label: '+4s', at: "l13:'أربعة،'" }
            - { pos: 0.9, label: '+8s', color: cyan, at: "l13:'تمانية.'" }
          cursor:
            - { at: "l13:'retry'", pos: 0 }
            - { at: "l13:'تمانية.'+0.3", pos: 0.9, dur: 0.6 }
        place: { x: 60, y: 220, w: 960, h: 260 }
        enter: { at: "l13:'retry'", anim: rise }
      - use: code
        id: bo_code
        props:
          title: 'backoff.ts'
          lines:
            - 'delay = base * 2 ** attempt;'
          highlight: [{ line: 1, at: "l14:'بتضاعف'+0.8", color: lime }]
          cps: 40
          fontSize: 36
        place: { x: 40, y: 540, w: 880, h: 180 }
        enter: { at: "l14:'بتضاعف'", anim: rise }
      - use: chip
        id: bo_breathe
        props: { text: 'server gets room to recover', color: lime, icon: server, size: 34 }
        place: { x: 40, y: 780, w: 760, h: 96 }
        enter: { at: "l14:'نفسه.'", anim: pop }

  # ── + jitter ───────────────────────────────────────────────────────────────
  - id: jitter
    at: l15
    glow: cyan
    elements:
      - use: title
        id: jt_title
        props: { text: '+ **Jitter**', size: 100, accent: cyan }
        place: { x: 40, y: 0, w: 1000, h: 170 }
        enter: { at: "l16:'Jitter،'", anim: pop }
      - use: table
        id: jt_table
        props:
          columns: ['client', 'backoff', '+ jitter']
          widths: [1.2, 1, 1]
          accent: cyan
          fontSize: 36
          rows:
            - { cells: ['client A', '4.0s', '4.0s'], at: "l15:'نفس'", strike: "l16:'Jitter،'" }
            - { cells: ['client B', '4.0s', '4.0s'], at: "l15:'نفس'+0.25", strike: "l16:'Jitter،'+0.1" }
            - { cells: ['client C', '4.0s', '4.0s'], at: "l15:'اللحظات.'", strike: "l16:'Jitter،'+0.2" }
            - { cells: ['client A', '4.0s', { text: '4.3s', color: cyan }], at: "l16:'random'" }
            - { cells: ['client B', '4.0s', { text: '3.6s', color: cyan }], at: "l16:'صغير'" }
            - { cells: ['client C', '4.0s', { text: '4.8s', color: cyan }], at: "l16:'انتظار.'" }
        place: { x: 40, y: 190, w: 1000, h: 430 }
        enter: { at: "l15:'مشكلة:'", anim: rise }
      - use: chip
        id: jt_spread
        props: { text: 'spread out, not one wave', color: lime, icon: check, size: 36 }
        place: { x: 40, y: 740, w: 760, h: 100 }
        enter: { at: "l17:'بتتفرّق'", anim: pop }

  # ── guard rails: limits + circuit breaker ──────────────────────────────────
  - id: limits
    at: l18
    glow: violet
    elements:
      - use: checklist
        id: lm_list
        props:
          title: 'retry policy'
          color: lime
          fontSize: 46
          items:
            - { text: 'max retries = 5', at: "l18:'max'" }
            - { text: 'max delay = 30s', at: "l18:'max'#2" }
        place: { x: 190, y: 0, w: 700, h: 440 }
        enter: { at: "l18:'max'", anim: rise, dur: 0.5 }
      - use: node
        id: lm_cb
        props: { title: 'Circuit Breaker', sub: 'CLOSED', icon: shield, color: violet, status: ok }
        place: { x: 190, y: 480, w: 700, h: 190 }
        enter: { at: "l19:'Circuit'", anim: pop }
        states:
          - { at: "l19:'يوقف'", set: { status: err, sub: 'OPEN · fail fast' } }
        fx:
          - { at: "l19:'يوقف'", do: flash, color: red }
      - use: chip
        id: lm_stop
        props: { text: 'no calls until healthy', color: red, icon: x, variant: outline, size: 34 }
        place: { x: 190, y: 740, w: 700, h: 96 }
        enter: { at: "l19:'المحاولات.'", anim: rise }

  # ── retries need idempotency ───────────────────────────────────────────────
  - id: idem
    at: l20
    glow: [{ at: l20, color: lime }, { at: l22, color: red }]
    elements:
      - use: title
        id: id_title
        props: { text: 'Retry needs **Idempotency**', size: 76 }
        place: { x: 40, y: 0, w: 1000, h: 180 }
        enter: { at: "l20:'retry'", anim: pop }
      - use: chip
        id: id_safe
        props: { text: 'SET balance = 100  →  same result', color: lime, icon: check, size: 34 }
        place: { x: 40, y: 250, w: 1000, h: 100 }
        enter: { at: "l21:'مرتين،'", anim: slide-l }
      - use: chip
        id: id_bad
        props: { text: 'charge $49  →  charged twice', color: red, icon: card, size: 34 }
        place: { x: 40, y: 400, w: 1000, h: 100 }
        enter: { at: "l22:'يخصم'", anim: slide-l }
      - use: stamp
        id: id_x2
        props: { text: '×2', color: red, size: 150 }
        place: { x: 290, y: 580, w: 500, h: 280 }
        enter: { at: "l22:'مرتين.'" }

  # ── 05 · next episode ──────────────────────────────────────────────────────
  - id: cta
    at: l23
    glow: lime
    elements:
      - use: cta
        id: cta_next
        props: { next: 'Deadlocks', keyword: 'deadlock', prompt: 'اكتب في الكومنتات', at: "l24:'deadlock'" }
        place: { x: 40, y: 140, w: 880, h: 620 }
        enter: { at: "l23:'الجاية'", anim: rise }
      - use: particles
        id: cta_conf
        props: { kind: confetti, count: 80, at: "l24:'توصلك.'", colors: [lime, cyan, violet, amber] }
