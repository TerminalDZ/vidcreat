# ReelForge · Intro — the product introduces itself, made entirely with ReelForge.
# Renders silently (captions + sound effects). Record voice.wav and mark cues to narrate it.
meta:
  id: intro
  series: 'REELFORGE'
  title: 'Meet ReelForge'
  episode: 1
  preset: tiktok
  theme: season1
  lang: en-US
  publish:
    cover: 'Your voice. Your video.'
    caption: |
      Write a script, drop components on a canvas, and every animation lands on the exact word you say.
      Word-by-word captions in English and Arabic, built-in sound design, AI-agent ready.
      Renders on your own computer. No subscription, no cloud.
    hashtags: ['#videoediting', '#motiongraphics', '#explainervideo', '#contentcreator', '#ai']
    pinned: 'Which explainer would you make first? 👇'

audio:
  voice: voice.wav
  sfx: auto
  sfx_gain_db: -4 # no voice: let the sound design carry it

script:
  - text: 'What if your voice could direct the whole video?'
  - text: 'Meet ReelForge.'
  - text: 'Write your script, one sentence per line.'
  - text: 'Drop titles, diagrams, code and charts on the canvas.'
  - text: 'Every element enters on the exact word you say.'
  - text: 'Captions follow your voice, word by word, in English and Arabic.'
  - text: 'Sound effects and mastered audio are built in.'
  - text: 'AI agents can build whole episodes for you, through MCP.'
  - text: 'Then render crisp vertical videos, right on your own computer.'
  - text: 'No subscription. No cloud. No cost per video.'
  - text: 'ReelForge. Your voice, your videos.'

chapters:
  - { at: l1, label: 'INTRO' }
  - { at: l3, label: 'HOW IT WORKS' }
  - { at: l9, label: 'YOURS' }

scenes:
  # 1 · Hook: the playhead runs across the spoken words.
  - id: hook
    at: l1
    glow: violet
    camera: push-in
    elements:
      - use: label
        id: hook_lbl
        props: { text: 'what if…', dot: true, color: violet }
        place: { x: 60, y: 60, w: 600, h: 60 }
        enter: { at: l1, anim: wipe }
      - use: title
        id: hook_title
        props: { text: "Your **voice**\ndirects it", size: 124, accent: violet }
        place: { x: 60, y: 150, w: 960, h: 320 }
        enter: { at: "l1:'voice'", anim: reveal, dist: 140 }
      - use: timeline
        id: words
        props:
          color: violet
          markers:
            - { pos: 0.06, label: 'what', at: "l1:'What'", color: dim }
            - { pos: 0.36, label: 'voice', at: "l1:'voice'", color: violet }
            - { pos: 0.66, label: 'direct', at: "l1:'direct'", color: cyan }
            - { pos: 0.94, label: 'video', at: "l1:'video'", color: lime }
          cursor:
            - { at: "l1:'What'", pos: 0.06, dur: 0.3 }
            - { at: "l1:'voice'", pos: 0.36, dur: 0.4 }
            - { at: "l1:'direct'", pos: 0.66, dur: 0.4 }
            - { at: "l1:'video'", pos: 0.94, dur: 0.4 }
        place: { x: 60, y: 560, w: 860, h: 220 }
        enter: { at: "l1:'What'", anim: rise }
        fx:
          - { at: "l1:'video'", do: pulse }

  # 2 · Brand reveal.
  - id: brand
    at: l2
    transition: zoom
    glow: lime
    elements:
      - use: title
        id: brand_title
        props: { text: '**Reel**Forge', size: 150, sub: 'voice → video' }
        place: { x: 60, y: 300, w: 960, h: 300 }
        enter: { at: 'l2+0.5', anim: spring, dur: 0.9 }
        fx:
          - { at: 'l2+0.6', do: shake, amp: 10, target: camera }
      - use: particles
        id: brand_burst
        props:
          {
            kind: burst,
            at: 'l2+0.85',
            count: 60,
            colors: [lime, cyan, violet],
            from: { x: 540, y: 450 },
            spread: 420,
          }
      - use: label
        id: brand_lbl
        props: { text: 'the explainer engine', color: dim, align: center }
        place: { x: 240, y: 180, w: 600, h: 60 }
        enter: { at: l2, anim: blur }

  # 3 · Script: the episode file types itself.
  - id: script
    at: l3
    transition: push
    glow: cyan
    elements:
      - use: label
        id: s_lbl
        props: { text: 'the script', dot: true, color: cyan }
        place: { x: 60, y: 40, w: 600, h: 60 }
        enter: { at: l3, anim: wipe }
      - use: code
        id: s_code
        props:
          title: 'episode.yaml'
          lang: yaml
          fontSize: 34
          lines:
            - { text: 'script:', at: "l3:'Write'" }
            - { text: "  - text: 'Hook them fast.'", at: "l3:'script'" }
            - { text: "  - text: 'One idea per line.'", at: "l3:'one'" }
            - { text: "  - text: 'Land the payoff.'", at: "l3:'per'" }
          cps: 44
          highlight:
            - { line: 3, at: "l3:'sentence'", color: cyan }
        place: { x: 60, y: 130, w: 960, h: 380 }
        enter: { at: "l3:'Write'", anim: rise }
      - use: chip
        id: s_chip
        props: { text: '1 line = 1 sentence', color: cyan, icon: check, variant: solid, size: 40 }
        place: { x: 160, y: 620, w: 680, h: 120 }
        enter: { at: "l3:'line'", anim: spring }

  # 4 · Canvas: real components drop in on their names.
  - id: canvas
    at: l4
    transition: slide-up
    glow: amber
    camera: drift
    elements:
      - use: title
        id: c_title
        props: { text: '**21** components', size: 92, accent: amber }
        place: { x: 60, y: 10, w: 960, h: 140 }
        enter: { at: "l4:'titles'", anim: reveal }
      - use: node
        id: api
        props: { title: 'API', sub: 'service', icon: server, color: cyan, status: ok }
        place: { x: 60, y: 190, w: 400, h: 170 }
        enter: { at: "l4:'diagrams'", anim: spring }
      - use: node
        id: db
        props: { title: 'DB', sub: 'database', icon: db, color: violet }
        place: { x: 620, y: 190, w: 400, h: 170 }
        enter: { at: "l4:'diagrams'+0.25", anim: spring }
      - use: arrow
        id: api_db
        props:
          { from: api.right, to: db.left, color: amber, packet: { at: "l4:'code'", dur: 0.8, color: amber } }
        enter: { at: "l4:'diagrams'+0.5", anim: draw }
      - use: code
        id: c_code
        props:
          title: 'any code'
          fontSize: 32
          lines:
            - { text: 'const video = await render(voice)', at: "l4:'code'" }
        place: { x: 60, y: 420, w: 960, h: 160 }
        enter: { at: "l4:'code'", anim: wipe }
      - use: meter
        id: c_meter
        props:
          label: 'charts'
          unit: '%'
          color: amber
          keyframes: [{ at: "l4:'charts'", value: 87, dur: 1.1 }]
        place: { x: 60, y: 650, w: 860, h: 150 }
        enter: { at: "l4:'charts'", anim: rise }

  # 5 · Word sync: each chip lands on the word it shows.
  - id: sync
    at: l5
    transition: push
    glow: lime
    elements:
      - use: chip
        id: w1
        props: { text: 'every', color: dim, size: 44 }
        place: { x: 60, y: 60, w: 300, h: 110 }
        enter: { at: "l5:'Every'", anim: pop }
      - use: chip
        id: w2
        props: { text: 'element', color: cyan, size: 44 }
        place: { x: 250, y: 210, w: 340, h: 110 }
        enter: { at: "l5:'element'", anim: spring }
      - use: chip
        id: w3
        props: { text: 'enters', color: violet, size: 44 }
        place: { x: 440, y: 360, w: 320, h: 110 }
        enter: { at: "l5:'enters'", anim: spring }
      - use: chip
        id: w4
        props: { text: 'on the exact word', color: lime, variant: solid, size: 44 }
        place: { x: 120, y: 520, w: 640, h: 110 }
        enter: { at: "l5:'word'", anim: pop }
      - use: stamp
        id: w_stamp
        layer: overlay
        props: { text: 'IN SYNC', color: lime, size: 96, rot: -6 }
        place: { x: 300, y: 700, w: 520, h: 170 }
        enter: { at: "l5:'say'", anim: stamp }

  # 6 · Captions in two languages.
  - id: captions
    at: l6
    transition: blur
    glow: violet
    elements:
      - use: label
        id: cap_lbl
        props: { text: 'captions', dot: true, color: violet }
        place: { x: 60, y: 40, w: 600, h: 60 }
        enter: { at: l6, anim: wipe }
      - use: title
        id: cap_en
        props: { text: 'word **by** word', size: 110, accent: violet }
        place: { x: 60, y: 140, w: 960, h: 180 }
        enter: { at: "l6:'word'", anim: reveal }
      - use: title
        id: cap_ar
        props: { text: 'كلمة **بكلمة**', size: 96, accent: lime, font: arabic }
        place: { x: 60, y: 340, w: 960, h: 240 }
        enter: { at: "l6:'Arabic'", anim: wipe, dur: 0.7 }
      - use: chip
        id: cap_ltr
        props: { text: 'English', color: violet, icon: globe, size: 36 }
        place: { x: 60, y: 640, w: 410, h: 96 }
        enter: { at: "l6:'English'", anim: slide-l, ease: snappy }
      - use: chip
        id: cap_rtl
        props: { text: 'العربية', color: lime, icon: globe, size: 36 }
        place: { x: 500, y: 640, w: 410, h: 96 }
        enter: { at: "l6:'Arabic'", anim: slide-r, ease: snappy }

  # 7 · Sound.
  - id: sound
    at: l7
    transition: zoom
    glow: amber
    camera: push-in
    elements:
      - use: icon
        id: snd_icon
        props: { name: bolt, size: 150, color: amber, ring: true, pulse: true }
        place: { x: 440, y: 40, w: 200, h: 200 }
        enter: { at: "l7:'Sound'", anim: pop }
      - use: counter
        id: lufs
        props:
          from: -32
          keyframes: [{ at: "l7:'mastered'", value: -14, dur: 1.2 }]
          suffix: ' LUFS'
          label: 'mastered loudness'
          color: amber
          size: 150
          separator: false
        place: { x: 60, y: 300, w: 960, h: 300 }
        enter: { at: "l7:'effects'", anim: blur }
      - use: chip
        id: snd_chip
        props: { text: 'whoosh · hit · pop', color: amber, icon: bolt, size: 36 }
        place: { x: 160, y: 680, w: 600, h: 100 }
        enter: { at: "l7:'built'", anim: spring }

  # 8 · AI agents through MCP.
  - id: agents
    at: l8
    transition: push
    glow: cyan
    elements:
      - use: node
        id: agent
        props: { title: 'Your AI agent', sub: 'writes & designs', icon: cpu, color: violet }
        place: { x: 220, y: 30, w: 640, h: 180 }
        enter: { at: "l8:'AI'", anim: drop }
      - use: arrow
        id: a1
        props:
          {
            from: agent.bottom,
            to: mcp.top,
            color: violet,
            packet: { at: "l8:'build'+0.2", dur: 0.6, color: violet },
          }
        enter: { at: "l8:'can'", anim: draw }
      - use: node
        id: mcp
        props: { title: 'ReelForge MCP', sub: '24 tools', icon: code, color: cyan, status: busy }
        place: { x: 220, y: 340, w: 640, h: 180 }
        enter: { at: "l8:'build'", anim: spring }
        states:
          - { at: "l8:'MCP'", set: { status: ok } }
        fx:
          - { at: "l8:'MCP'", do: pulse }
      - use: arrow
        id: a2
        props:
          {
            from: mcp.bottom,
            to: ep.top,
            color: cyan,
            packet: { at: "l8:'episodes'+0.1", dur: 0.5, color: cyan },
          }
        enter: { at: "l8:'whole'", anim: draw }
      - use: node
        id: ep
        props: { title: 'episode.yaml', sub: 'ready to render', icon: check, color: lime, status: ok }
        place: { x: 220, y: 650, w: 640, h: 180 }
        enter: { at: "l8:'episodes'", anim: rise }

  # 9 · Render.
  - id: render
    at: l9
    transition: slide-up
    glow: lime
    camera: push-in
    elements:
      - use: title
        id: r_title
        props: { text: '1080 × **1920**', size: 120, sub: '9:16 · 30 fps · H.264' }
        place: { x: 60, y: 40, w: 960, h: 270 }
        enter: { at: "l9:'vertical'", anim: reveal }
      - use: meter
        id: r_meter
        props:
          label: 'rendering'
          unit: '%'
          color: lime
          keyframes: [{ at: "l9:'render'", value: 100, dur: 2.6 }]
        place: { x: 60, y: 380, w: 860, h: 150 }
        enter: { at: "l9:'render'", anim: wipe }
      - use: node
        id: r_pc
        props: { title: 'Your computer', sub: 'offline · private', icon: cpu, color: lime, status: ok }
        place: { x: 120, y: 620, w: 680, h: 180 }
        enter: { at: "l9:'computer'", anim: spring }

  # 10 · No strings attached.
  - id: free
    at: l10
    transition: push
    glow: red
    elements:
      - use: chip
        id: f1
        props: { text: 'subscription', color: red, icon: card, size: 46, strike: "l10:'subscription'+0.35" }
        place: { x: 60, y: 60, w: 560, h: 120 }
        enter: { at: "l10:'subscription'", anim: slide-l }
      - use: chip
        id: f2
        props: { text: 'cloud', color: red, icon: cloud, size: 46, strike: "l10:'cloud'+0.35" }
        place: { x: 60, y: 230, w: 400, h: 120 }
        enter: { at: "l10:'cloud'", anim: slide-l }
      - use: chip
        id: f3
        props: { text: 'cost per video', color: red, icon: cart, size: 46, strike: "l10:'per'" }
        place: { x: 60, y: 400, w: 600, h: 120 }
        enter: { at: "l10:'cost'", anim: slide-l }
      - use: stamp
        id: f_stamp
        layer: overlay
        props: { text: '100% YOURS', color: lime, size: 100, rot: -5 }
        place: { x: 180, y: 620, w: 640, h: 190 }
        enter: { at: "l10:'video'", anim: stamp }

  # 11 · Outro.
  - id: outro
    at: l11
    transition: zoom
    glow: lime
    elements:
      - use: title
        id: o_title
        props: { text: '**Reel**Forge', size: 160 }
        place: { x: 60, y: 220, w: 960, h: 240 }
        enter: { at: "l11:'ReelForge'", anim: spring }
      - use: label
        id: o_lbl
        props: { text: 'your voice · your videos', color: ink, align: center, size: 40 }
        place: { x: 140, y: 500, w: 800, h: 80 }
        enter: { at: "l11:'voice'", anim: blur }
      - use: chip
        id: o_chip
        props: { text: 'start creating today', color: lime, icon: bolt, variant: solid, size: 40 }
        place: { x: 190, y: 640, w: 700, h: 120 }
        enter: { at: "l11:'videos'", anim: rise }
      - use: particles
        id: o_conf
        props: { kind: confetti, count: 90, at: "l11:'videos'+0.2", colors: [lime, cyan, violet, amber] }
